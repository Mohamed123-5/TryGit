# DESTRUCTIVE: creates ONE real booking on the ZERO booking-fee path ("Confirm booking").
# Explicit run authorization required. No payment, card data, invoice or gateway step exists here.
# First matching unit only. Inventory with a fee above 0 is unsuitable test data and fails before
# anything is committed; no retries across units. PASS only when the new Active booking of the
# SAME unit is proven under My bookings - never from the Confirm tap itself.
appId: fi.iwa.sakani
name: Full Journey - zero-fee booking
tags:
  - critical
env:

  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1000011487" : String(NATIONAL_ID)}'
  PROJECT: '${typeof PROJECT === "undefined" ? "مساكن طيبة المدائن EN" : String(PROJECT)}'
  PROJECT_SEARCH: '${typeof PROJECT_SEARCH === "undefined" ? "طيبة" : String(PROJECT_SEARCH)}'
  MODULE: '${typeof MODULE === "undefined" ? "Apartment" : String(MODULE)}'
---
- evalScript: ${console.log('FULL JOURNEY TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}

# The shared login helper owns authentication and its proof; the journey starts straight after it.
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/login.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}

- tapOn: 'Explore\s*Tab 2 of 4'
- runFlow:
    file: ../subflows/clear-overlays.yaml
    env:
      ANCHOR: "Registered Interests"
# (clear-overlays itself ends with assertVisible on its ANCHOR - no second wait for it here.)

- tapOn: "(Construction Status|Ready Units|Readymade|Offplan|Land)"
- waitForAnimationToEnd:
    timeout: 8000

# The two filter sheets are alternatives: in all 14 saved runs "Start searching" appeared and
# "Apply" never did, and the absence check for "Apply" cost ~7 s every time. It now runs only when
# the "Start searching" sheet did not.
- evalScript: ${output.startSearchingSheet = false}
- runFlow:
    when:
      visible: "Start searching"
    commands:
      - evalScript: ${output.startSearchingSheet = true}
      - tapOn: "Buy"
      - assertVisible: "Offplan"
      - tapOn: "Offplan"
      - tapOn: "Start searching"

- runFlow:
    when:
      true: ${output.startSearchingSheet !== true}
    commands:
      - runFlow:
          when:
            visible: "Apply"
          commands:
            - tapOn: "Clear"
            - waitForAnimationToEnd:
                timeout: 5000
            - assertVisible: "Offplan"
            - tapOn: "Offplan"
            - tapOn: "Apply"

- waitForAnimationToEnd:
    timeout: 20000

- extendedWaitUntil:
    visible: "Offplan"
    timeout: 45000
- extendedWaitUntil:
    visible: 'Projects\s*Tab 1 of 2'
    timeout: 45000
- takeScreenshot: journey-2-marketplace
# FAST PATH: we are on the results list (Projects tab proven above), where the search sheet is not
# open - one tap on the search bar, then wait for its sheet. Run 30/09 14:48: the old loop spent
# 4.3 s on the tap and 7.1 s more only to find "Popular locations" already there. The original
# guarded loop stays as the fallback when the sheet does not open.
- evalScript: ${output.searchSheetOpen = false}
- runFlow:
    optional: true
    commands:
      - tapOn:
          point: "55%,11%"
      - extendedWaitUntil:
          visible: "Popular locations"
          timeout: 10000
      - evalScript: ${output.searchSheetOpen = true}
- runFlow:
    when:
      true: ${output.searchSheetOpen !== true}
    commands:
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  notVisible: "Popular locations"
                commands:
                  - tapOn:
                      point: "55%,11%"
                  - waitForAnimationToEnd:
                      timeout: 8000
- extendedWaitUntil:
    visible: "Popular locations"
    timeout: 30000
- tapOn: "Enter Region, City, Neighborhood, Street, Project, Developer, Building Number, Block Number"
- inputText: ${PROJECT_SEARCH}

# Results arrive grouped - Location, Property, Developer. Projects are listed under "Property";
# a "Location" row can also contain the search term (a land-plan "Project ..."), so the tap is
# constrained to the full project name AND to rows below the "Property" header.
- extendedWaitUntil:
    visible: "Property"
    timeout: 30000
- takeScreenshot: journey-2-search-results
- tapOn:
    text: "(?s).*${PROJECT}.*"
    below:
      text: "Property"

# Opening a project raises the one-off "Start comparing properties" coach mark over it on a
# fresh install (seen 10/09/2026); the helper closes it with Back - never its CTA - and stops at
# the project page.
- runFlow:
    file: ../subflows/clear-overlays.yaml
    env:
      ANCHOR: "About this project"

# --- Destination check: Project Details, and it is a bookable Offplan project.
- extendedWaitUntil:
    visible: "View units"
    timeout: 45000
- assertVisible: "About this project"
- assertVisible: "Bookings open"
- assertVisible: "(?s).*available units.*"

# The project-type assertion this whole flow exists for. "Units under construction" is STG's
# label for Offplan; a Ready Units project renders "Ready Units" here and fails this line
# immediately, which is the intended behaviour.
- scrollUntilVisible:
    element:
      text: "Project type"
    direction: DOWN
    timeout: 45000
- assertVisible: "Units under construction"
- runFlow:
    when:
      visible: "Target audience"
    commands:
      - assertVisible: "For all"

- assertVisible: "Payment methods"
- assertVisible: "Cash"

# ==========================================================================================
# STAGE 3 - Module inside the project, then a unit inside that module
# ==========================================================================================

- tapOn: "View units"
- extendedWaitUntil:
    visible: "(?s).*Unit list.*"
    timeout: 45000
- runFlow:
    when:
      visible: "Property type"
    commands:
      - tapOn: "Property type"
      - extendedWaitUntil:
          visible: "Apply"
          timeout: 20000
      - assertVisible: ${MODULE}
      - tapOn: ${MODULE}
      - tapOn: "Apply"
      - extendedWaitUntil:
          visible: "(?s).*Unit list.*"
          timeout: 45000

- assertNotVisible: "Scrim"

- extendedWaitUntil:
    visible: "(?s).*(Available|matched).*"
    timeout: 45000
- tapOn: "(?s).*${MODULE}s? (Available|matched).*"

# Destination check: inside the module, listing its units.
- extendedWaitUntil:
    visible: "Eligibility type"
    timeout: 45000
- assertVisible: "(?s).*Prices.*"

# Preserve the selected card for the same-booking proof. Observed 29/09/2026: the card title
# "Apartment 999-182" is <block>-<unit number> of the unit on the booking summary.
- copyTextFrom:
    text: '(?s)${MODULE} [0-9A-Za-z-]+\n.*'
    index: 0
- evalScript: ${output.selectedUnitCard = String(maestro.copiedText)}
- tapOn:
    text: '(?s)${MODULE} [0-9A-Za-z-]+\n.*'
    index: 0

# Destination check: Unit Details for a unit of the selected module, and it is reservable.
- extendedWaitUntil:
    visible: "Mortgage Calculator"
    timeout: 45000
- assertVisible: "(?s).*Unit Price.*"
- assertVisible: "Reserve unit"
- takeScreenshot: journey-3-unit-details

# ==========================================================================================
# STAGE 4 - Reserve the unit
# ==========================================================================================

- tapOn: "Reserve unit"

# OPTIONAL "reserving another unit" dialog - shown only when the account already holds a pending
# booking on ANOTHER unit (observed 29/09 15:29, 16:51 and 30/09 14:53, PRE-4.7.6-1283):
#   "Are you sure?" / "You are reserving another unit in project <project>. Click here to view
#   current booking. Click 'Yes' to discard current booking and continue reserve this unit. ..."
#   buttons No / Yes.
# DECIDED BEHAVIOUR (user, 30/09/2026): ALWAYS "Yes" - discard the earlier pending booking and
# reserve the unit THIS journey selected. Never "No", never "Click here". Matched on its own
# message, so no other "Are you sure?" dialog can take this tap.
- extendedWaitUntil:
    visible: "(?s)(Booking summary|You are reserving another unit.*)"
    timeout: 45000
- runFlow:
    when:
      visible: "(?s)You are reserving another unit.*"
    commands:
      - assertVisible: "Are you sure?"
      - evalScript: "${console.log('RESERVE - pending booking on another unit; discarding it with Yes and reserving this unit')}"
      - takeScreenshot: journey-4-reserve-another-unit-dialog
      - tapOn:
          text: "^Yes$"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          notVisible: "Are you sure?"
          timeout: 15000
          label: "RESERVE - pending booking confirmation dialog did not close after Yes"

- extendedWaitUntil:
    visible: "Booking summary"
    timeout: 45000
- assertVisible: "Please check your reservation details below and click Confirm booking."
- extendedWaitUntil:
    visible: "Booking Details"
    timeout: 30000

- scrollUntilVisible:
    element:
      text: "Project Type"
    direction: DOWN
    timeout: 30000

# Second project-type gate, at the last point before the reservation is committed. This
# screen spells it "Off-plan", hyphenated, where Project Details spells the same fact
# "Units under construction"; each is matched where it is actually rendered.
- assertVisible: "Project Type"
- assertVisible: "(?s).*Off-?plan.*"

# Read the fee label, then enforce the business-path and numeric-fee gates below.
- scrollUntilVisible:
    element:
      text: "Booking Fee"
    direction: DOWN
    timeout: 30000
- assertVisible: "Booking Fee"
- takeScreenshot: journey-4-booking-summary

# ZERO-FEE PATH ONLY. The fee is read from the rendered summary first; a fee above 0 is
# unsuitable test data for this journey and stops the run here, before anything is committed.
# Nothing on this path pays: there is no "Pay booking fee" step anywhere in this flow.
- assertVisible: "Unit booking"
- copyTextFrom:
    text: '[0-9][0-9,]*(\.[0-9]+)?'
    below: "Booking Fee"
    above: "Booking disclaimer"
- evalScript: ${output.bookingFee = Number(String(maestro.copiedText).replace(/,/g, ""))}
- evalScript: "${console.log('BOOKING SUMMARY - Booking Fee rendered as [' + maestro.copiedText + '] = ' + output.bookingFee)}"
- assertTrue:
    condition: ${output.bookingFee === 0}
    label: "TEST DATA - Booking Fee is not 0: unit unsuitable for the zero-fee journey"
- assertNotVisible:
    text: "Pay booking fee"
    label: "TEST DATA - summary offers Pay booking fee: unit unsuitable for the zero-fee journey"
- assertVisible:
    text: "Confirm booking"
    label: "PRECONDITION - zero-fee summary must expose Confirm booking"

# Unit identity for the same-booking proof, read from the summary rows observed on
# PRE-4.7.6-1283 (label node above its value node). Relative filters pick the closest match.
- copyTextFrom:
    text: '[0-9]+'
    below: "Block"
- evalScript: ${output.unitBlock = String(maestro.copiedText)}
- copyTextFrom:
    text: '[0-9]+'
    below:
      text: "${MODULE}"
      index: 0
- evalScript: ${output.unitNumber = String(maestro.copiedText)}
- evalScript: "${console.log('ZERO-FEE UNIT - card [' + String(output.selectedUnitCard).replace(/\\n/g, ' | ') + '] block [' + output.unitBlock + '] ' + MODULE + ' [' + output.unitNumber + ']')}"
- assertTrue:
    condition: ${String(output.selectedUnitCard).indexOf(output.unitBlock + '-' + output.unitNumber) >= 0}
    label: "PRECONDITION - booking summary is not for the selected unit card"

# ==========================================================================================
# STAGE 5 - Acknowledge the booking disclaimer, then Confirm booking (commits the reservation)
# ==========================================================================================
- scrollUntilVisible:
    element:
      text: "I have read and understood the Booking disclaimer"
    direction: DOWN
    timeout: 30000
- assertVisible: "Booking disclaimer"
- assertVisible: "I have read and understood the Booking disclaimer"
- waitForAnimationToEnd:
    timeout: 5000

# CHECKBOX STATE - NO SEMANTIC STATE EXISTS (probe 2026-09-29_164304, before/after a real tap).
# The checkbox is a clickable ImageView [42,2064][105,2127] with no text or accessibilityText; it
# reports checked=false, selected=false, enabled=true, clickable=true IDENTICALLY when ticked and
# unticked, and a `checked: true` query found nothing in either state. The only change is
# "Confirm booking" clickable true/false, which Maestro 2.9 selectors cannot match (enabled stays
# true). So, as for the Favorites chips in account.yaml, the state is proven by the checkbox's own
# pixels against a reference captured on this device and verified to reject the unticked state.
#
# SELECTOR. `leftOf` alone ignores vertical position and resolved to the header back arrow
# [0,132][147,279] (run 16:13, which left the summary). The three relations below together match
# only the checkbox - proven by both probe taps landing on [42,2064][105,2127].
#
# Tapped ONLY when it does not match the ticked reference - a blind tap would untick an already
# ticked box - at most once, and the ticked state is then REQUIRED before Confirm booking.
- evalScript: ${output.disclaimerTicked = false}
- runFlow:
    optional: true
    commands:
      - assertScreenshot:
          path: ../reference-screenshots/booking/disclaimer-ticked.png
          cropOn:
            leftOf: "I have read and understood the Booking disclaimer"
            below: "Read all"
            above: "Confirm booking"
          thresholdPercentage: 95
      - evalScript: ${output.disclaimerTicked = true}
- runFlow:
    when:
      true: ${output.disclaimerTicked !== true}
    commands:
      - evalScript: "${console.log('DISCLAIMER - checkbox does not match the ticked reference; ticking it once')}"
      - tapOn:
          leftOf: "I have read and understood the Booking disclaimer"
          below: "Read all"
          above: "Confirm booking"
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 5000
- assertScreenshot:
    path: ../reference-screenshots/booking/disclaimer-ticked.png
    cropOn:
      leftOf: "I have read and understood the Booking disclaimer"
      below: "Read all"
      above: "Confirm booking"
    thresholdPercentage: 95
    label: "DISCLAIMER - the Booking disclaimer checkbox is not ticked"
- evalScript: "${console.log('DISCLAIMER - acknowledgement proven by the ticked checkbox pixels (already ticked on arrival=' + output.disclaimerTicked + ')')}"
- assertVisible: "Confirm booking"
- takeScreenshot: journey-5-before-confirm

# ONE tap, no Maestro-level re-tap: a re-sent tap after a slow response could submit a second
# booking. Actionability is proven only by the summary actually being left below.
- tapOn:
    text: "Confirm booking"
    retryTapIfNoChange: false
- takeScreenshot: journey-5-after-confirm-tap
# POST-CONFIRM SIGNALS ARE INFORMATIONAL - THE PROOF IS THE PERSISTED BOOKING (Stage 6).
# Run 2026-09-29_175202: the summary text left the hierarchy 1.6 s after the tap while the summary
# was still on screen under the loading spinner, so its absence proves nothing; the banner has only
# ever been seen in a screenshot (29/09 11:24), never proven in the hierarchy, and in that run the
# app died (SIGFPE in the emulator GL library, 17:57:03) with the booking already created. Neither
# may decide the verdict: both are recorded, and Stage 6 must find THIS unit's Active booking.
- evalScript: ${output.summaryLeft = false}
- runFlow:
    optional: true
    commands:
      # Observed gone 1.5-1.6 s after the tap (29/09 11:24, 17:52); informational only.
      - extendedWaitUntil:
          notVisible: "Please check your reservation details below and click Confirm booking."
          timeout: 15000
      - evalScript: ${output.summaryLeft = true}
# A product error after Confirm booking is a RESULT and still fails the run here.
- assertNotVisible:
    text: '(?s)(.*There.s something wrong.*|.*the service is down.*|Error!)'
    label: "CONFIRM - the product reported an error after Confirm booking"
# Observed 29/09/2026 11:24 (screenshot): a green banner "Your booking has been confirmed! to
# continue your booking you have to select payment method and sign sales contract".
- evalScript: ${output.confirmBannerSeen = false}
- runFlow:
    optional: true
    commands:
      # Seen within 8 s of the tap (29/09 11:24, screenshot); informational only, so a banner
      # that never reaches the hierarchy must not cost every run a long wait.
      - extendedWaitUntil:
          visible: "(?s).*Your booking has been confirmed!.*"
          timeout: 15000
      - evalScript: ${output.confirmBannerSeen = true}
- takeScreenshot: journey-5-post-confirm-state
- evalScript: "${console.log('AFTER CONFIRM - summary text gone=' + output.summaryLeft + ' | confirmation banner seen=' + output.confirmBannerSeen + ' (informational; proof = Active booking of this unit)')}"

# APP-IN-FOREGROUND EVIDENCE (informational since 30/09/2026 - user decision: not a PASS/FAIL
# condition). Every app screen on this PRE build carries the environment ribbon "PRE-4.7.6-1283";
# after the process died (runs 2026-09-29_175202, 2026-09-30_151935: SIGFPE in the emulator GL
# library) the hierarchy held only the Android launcher. Either way the warm relaunch below reaches
# the persisted booking; if the app had left the foreground this is logged, screenshotted and
# reported in the END line, and the device logcat in the run's debug output holds the tombstone.
# (A non-PRE build without the ribbon would be reported as not-in-foreground: update this marker.)
- evalScript: ${output.appInForegroundAfterConfirm = false}
- runFlow:
    when:
      visible: 'PRE-[0-9]+(\.[0-9]+)*-[0-9]+'
    commands:
      - evalScript: ${output.appInForegroundAfterConfirm = true}
- runFlow:
    when:
      true: ${output.appInForegroundAfterConfirm !== true}
    commands:
      - evalScript: "${console.log('APP LEFT FOREGROUND after Confirm booking (crash suspected - see device logcat); relaunching to reach the persisted booking')}"
      - takeScreenshot: journey-5-app-not-in-foreground

# ==========================================================================================
# STAGE 6 - Prove the booking in the product's own record: My bookings -> Active
# ==========================================================================================
# Baseline (read-only probe, 29/09/2026): this account had no Active booking before the run.
# Leave the post-confirm screen through the Account tab when it is there; otherwise a warm
# relaunch (session kept - proven 29/09/2026 after Confirm booking) returns to Home.
- runFlow:
    when:
      notVisible: '(?s)(Account\s*Tab 4 of 4|.*would you recommend benefiting from Sakani.*)'
    commands:
      - evalScript: "${console.log('AFTER CONFIRM - no Account tab on the post-confirm screen; warm relaunch to Home')}"
      - launchApp
# Observed 29/09/2026: after the relaunch Home is covered by the satisfaction survey (D-12,
# "Overall, how satisfied are you...") which hides the tab bar; the shared helper dismisses it.
- runFlow:
    file: ../subflows/clear-overlays.yaml
    env:
      ANCHOR: 'Account\s*Tab 4 of 4'
# FAST PATH FIRST, shared helpers as the fallback (same pattern as cancel-booking.yaml, measured
# 44 s -> 4.8 s). Each helper pass pays ~7 s for the NPS absence check plus ~7 s for its exit check
# (probe 29/09 11:36: Account 22.5 s, My bookings -> Active 19.0 s). The helper runs only if the
# direct tap did not reach its destination - NPS covering the tab included - and it still asserts
# the same destination.
- evalScript: ${output.accountReached = false}
- runFlow:
    optional: true
    commands:
      - tapOn:
          text: 'Account\s*Tab 4 of 4'
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible: "My bookings"
          timeout: 15000
      - evalScript: ${output.accountReached = true}
- runFlow:
    when:
      true: ${output.accountReached !== true}
    commands:
      - runFlow:
          file: ../subflows/open-account-tab.yaml
          env:
            DESTINATION: "My bookings"
- evalScript: ${output.bookingsReached = false}
- runFlow:
    optional: true
    commands:
      - tapOn:
          text: "My bookings"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible: 'Active\s*Tab 2 of 4'
          timeout: 15000
      - evalScript: ${output.bookingsReached = true}
- runFlow:
    when:
      true: ${output.bookingsReached !== true}
    commands:
      - runFlow:
          file: ../subflows/tap-until-destination.yaml
          env:
            TARGET: "My bookings"
            DESTINATION: 'Active\s*Tab 2 of 4'
- evalScript: "${console.log('STAGE 6 NAVIGATION - Account fast path=' + output.accountReached + ' | My bookings fast path=' + output.bookingsReached)}"
- tapOn: 'Active\s*Tab 2 of 4'
# Active list observed loaded in < 1 s (probes 29/09, 30/09); 30 s still covers a slow PRE backend.
- extendedWaitUntil:
    visible: "(?s).*(\nActive\n.*Unit code|don.t have any active booking).*"
    timeout: 30000
- takeScreenshot: journey-without-fee-my-bookings-active
- assertNotVisible:
    text: "(?s).*don.t have any active booking.*"
    label: "BOOKING - no Active booking exists after Confirm booking"

# Same unit. Observed 29/09/2026: Block 999 / Apartment 182 was booked as unit code
# 01-01-0504-999-182 - the code ends in <block>-<unit number> read from the summary. The card is
# located BY that identity, never by position: with several Active bookings the first card may be
# an older one. Observed card text: "<project>\nActive\nUnit Type\nApartment\nUnit code\n<code>\n
# Booking date\n<date>".
- scrollUntilVisible:
    element:
      text: "(?s).*\nActive\n.*\nUnit code\n[0-9]{2}(-[0-9]+)*-${output.unitBlock}-${output.unitNumber}\n.*"
    direction: DOWN
    timeout: 30000
    label: "BOOKING - no Active booking for the booked unit (block ${output.unitBlock}, unit ${output.unitNumber})"
- copyTextFrom:
    text: "(?s).*\nActive\n.*\nUnit code\n[0-9]{2}(-[0-9]+)*-${output.unitBlock}-${output.unitNumber}\n.*"
- evalScript: ${output.activeCard = String(maestro.copiedText)}
- evalScript: '${output.unitCode = (output.activeCard.match(/Unit code\s*([0-9]{2}(-[0-9]+)+)/) || ["", ""])[1]}'
- evalScript: "${console.log('ZERO-FEE BOOKING - Active card [' + output.activeCard.replace(/\\n/g, ' | ') + '] unit code [' + output.unitCode + ']')}"
- assertTrue:
    condition: ${output.unitCode.length > 0 && output.unitCode.slice(-(output.unitBlock.length + output.unitNumber.length + 2)) === '-' + output.unitBlock + '-' + output.unitNumber}
    label: "BOOKING - the Active booking's unit code is not the booked unit"
- tapOn: "(?s).*\nActive\n.*\nUnit code\n${output.unitCode}\n.*"

# END OF THE JOURNEY (30/09/2026): the booking created by this run, found under My bookings ->
# Active by its unit identity and opened. The only final proof is that its Booking Details
# opened; its contents, Unit Details, payment and contract are not part of this journey.
- extendedWaitUntil:
    visible: 'Booking Details\s*Tab 1 of 2'
    timeout: 30000
- takeScreenshot: journey-final-booking-details
- evalScript: "${console.log('FULL JOURNEY END - booking created and opened successfully, unit code [' + output.unitCode + '], block [' + output.unitBlock + '], unit [' + output.unitNumber + '] | app stayed in foreground after Confirm=' + output.appInForegroundAfterConfirm + ' (informational)')}"
