# Eligibility & Appeal Journey - register ONE new adult user (called once by e2e/check-eligibility.yaml).
#
# PRE TEST-DATA WINDOW - minute 25 to 55
# PRE's mock identity service sets the applicant's Date of Birth to "today minus <current minute>
# Hijri years" at the moment the profile is created; the National ID has no influence (22/22 recorded
# profiles, 04-05/10/2026). So a run started between minute 25 and 55 gets an applicant older than 24.
# Outside that window the run stops here as a TEST DATA BLOCKER, before an ID is generated or the app is
# opened: 00-24 would give a too-young applicant, 56-59 could create the profile in the next hour.
# No waiting and no retry - the run simply stops.
#
# The window is only a precondition. The PROOF is the Date of Birth PRE actually shows on "Personal
# information": register-new-user.yaml requires it to be older than 24 Hijri years before any phone,
# email or OTP is entered, and stops there otherwise - no account, no second ID.
#
# Exactly ONE identity per run: National ID 1 + 9 random digits (uniqueness only - it does not control
# the age); phone 50 + 7 random digits (the app rejects numbers starting 52); email
# elig.<id>@example.com; OTP from REGISTRATION_OTP.
appId: fi.iwa.sakani
name: Eligibility journey - register one adult new user
---
# 1. PRE test-data window - checked before anything is generated or opened.
- evalScript: ${output.currentMinute = new Date().getMinutes()}
- runFlow:
    when:
      true: ${!(output.currentMinute >= 25 && output.currentMinute <= 55)}
    commands:
      - evalScript: "${console.log('TEST DATA BLOCKER - PRE mock applicant age is based on the current minute. Current minute [' + output.currentMinute + '] is outside the supported adult window 25-55. No identity was generated and no account was created.')}"
- assertTrue:
    condition: ${output.currentMinute >= 25 && output.currentMinute <= 55}
    label: "TEST DATA BLOCKER - PRE mock applicant age is based on the current minute. Current minute (logged above) is outside the supported adult window 25-55. No identity was generated and no account was created."

# 2. The ONE identity of this run.
- evalScript: ${output.generatedNationalId = String(Math.floor(1000000000 + Math.random() * 1000000000))}
- evalScript: ${output.generatedPhone = String(Math.floor(500000000 + Math.random() * 10000000))}
- evalScript: ${output.generatedEmail = 'elig.' + output.generatedNationalId + '@example.com'}
- evalScript: "${console.log('NEW USER - National ID [' + output.generatedNationalId + '] phone [+966' + output.generatedPhone + '] email [' + output.generatedEmail + '] - started at minute ' + output.currentMinute)}"

# 3. Register it: clean app -> Login / Sign up -> Nafath -> Personal information (real DOB, age > 24
#    required) -> phone -> email -> OTP -> authenticated Home. Any failure fails the run.
- launchApp:
    clearState: true
- runFlow:
    file: register-new-user.yaml
    env:
      NATIONAL_ID: ${output.generatedNationalId}
      PHONE: ${output.generatedPhone}
      EMAIL: ${output.generatedEmail}
      OTP: ${REGISTRATION_OTP}
      MIN_AGE_HIJRI_YEARS: "24"
- evalScript: "${console.log('ELIGIBILITY NEW USER - National ID [' + output.generatedNationalId + '] DOB [' + output.applicantDobHijri + '] age ' + output.applicantAgeHijri + ' Hijri years - registered (the only registration of this run)')}"
