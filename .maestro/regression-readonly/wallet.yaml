e, through the shared

appId: fi.iwa.sakani
name: WAL-008 over-balance withdrawal blocked, PRE-002 registered-interest empty state, PRE-008 preference-form gate, MTG validation, WAL-010 D-31 guard
tags:
  - health-check
env:
 
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1012204739" : String(NATIONAL_ID)}'
---

- evalScript: ${console.log('WALLET.YAML TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}
- launchApp:
    clearState: true


- runFlow:
    file: ../subflows/login.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}


- runFlow:
    file: ../subflows/open-account-tab.yaml
    env:
      DESTINATION: "My bookings"
- assertNotVisible: "Log in"


- tapOn: "Preferences"
- extendedWaitUntil:
    visible: "(?s).*Registered interest.*"
    timeout: 30000
- assertVisible: "(?s).*Preference form.*"

- tapOn: "(?s).*Registered interest.*"
- extendedWaitUntil:
    visible: "Your register interest list is empty"
    timeout: 30000


- assertVisible: "Mega projects"
- assertVisible: "Projects"
- assertVisible: "Brokers"
- assertVisible: "Developers"


- assertVisible: "Explore marketplace to register your interests"
- assertVisible: "Explore marketplace"
# --- end PRE-002
- back
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 30000


- tapOn: "Preferences"
- extendedWaitUntil:
    visible: "(?s).*Preference form.*"
    timeout: 30000
- tapOn: "(?s).*Preference form.*"

- extendedWaitUntil:
    visible: "Step 1 of 2"
    timeout: 30000
- assertVisible: "Region"
- assertVisible: "City"
- assertVisible: "Neighborhood"
- assertVisible: "Completion status"
- assertVisible: "Property type"


- tapOn:
    point: "73%,93%"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: "Step 1 of 2"
- assertNotVisible: "Step 2 of 2"


- tapOn: "Ready(made| )?Units"
- tapOn: "Villa"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "73%,93%"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: "Step 1 of 2"
- assertNotVisible: "Step 2 of 2"

- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "(?s).*Preference form.*"
    timeout: 30000
- assertNotVisible: "Step 1 of 2"
# --- end PRE-008

- back
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 30000


- runFlow:
    file: ../subflows/tap-until-destination.yaml
    env:
      TARGET: 'Services\s*Tab 3 of 4'
      DESTINATION: "Categories"
- tapOn: "(?s).*Professional Services.*"
- extendedWaitUntil:
    visible: "Explore Professional Services"
    timeout: 30000
- tapOn: "(?s).*Mortgage Calculator.*"


- extendedWaitUntil:
    visible: "Calculate Your Mortgage"
    timeout: 30000
- assertVisible: 'Services Fee\s*SAR\s*0\.00'

- assertVisible: 'Expected time\s*Immediate'
- assertVisible: 'Service available on\s*Sakani web, mobile app'


- tapOn: "Calculate Your Mortgage"
- extendedWaitUntil:
    visible: "Financial information"
    timeout: 30000
- assertVisible: 'Property Price \*'
- assertVisible: 'Monthly Income \*'
- assertVisible: 'Funding period \*'
- assertVisible: 'Annual Interest Rate \*'
- assertVisible: 'Down Payment Percentage \*'


- tapOn:
    below:
      text: 'Monthly Income \*'
- eraseText: 20
- inputText: "1000"
- extendedWaitUntil:
    visible: "(?s).*Must be between.*2000.*500,000.*"
    timeout: 20000

# MTG-006: a valid income clears the error.
- tapOn:
    below:
      text: 'Monthly Income \*'
- eraseText: 20
- inputText: "20000"
- extendedWaitUntil:
    notVisible: "(?s).*Must be between.*2000.*500,000.*"
    timeout: 20000


- back
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible: 'Account\s*Tab 4 of 4'
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    visible: 'Account\s*Tab 4 of 4'
    timeout: 30000
- runFlow:
    file: ../subflows/open-account-tab.yaml
    env:
      DESTINATION: "My bookings"


- tapOn: "(?s).*Wallet.*"
- extendedWaitUntil:
    visible: "Available Balance"
    timeout: 30000
- assertVisible: "Reserved Balance"
- assertVisible: "Total Balance"

- assertVisible: "Transaction( history)?"

- assertNotVisible:
    text: "0(\\.00)?"
    below: "Available Balance"
    above: "Reserved Balance"
    label: "PRECONDITION - WAL-008 needs a positive Available Balance on NATIONAL_ID (test data)"

- tapOn: "Withdraw"
- extendedWaitUntil:
    visible: "Use max balance"
    timeout: 30000


- tapOn:
    below:
      text: "Designed to Keep You Safe"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: "Use max balance"
- assertVisible: "(?s).*Wallet balance.*"


- tapOn:
    rightOf:
      text: "SAR"
- inputText: "999999999"

# WAL-009: the amount is auto-formatted with thousands separators as it is typed.
- extendedWaitUntil:
    visible: "999,999,999"
    timeout: 20000

# WAL-008 expected result: the over-balance amount is rejected inline. Nothing is submitted.
- extendedWaitUntil:
    visible: "The amount exceeds the available balance."
    timeout: 20000
# --- end WAL-008


- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible: "Transaction( history)?"
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 6000
- extendedWaitUntil:
    visible: "Transaction( history)?"
    timeout: 30000
- assertVisible: "Available Balance"


- back
- extendedWaitUntil:
    visible: "Profile details"
    timeout: 30000
- assertVisible: "My bookings"
- assertNotVisible: "Available Balance"
# --- end WAL-010
