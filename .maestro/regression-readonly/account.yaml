# Read-only Account service journey. Evidence: live 1012204739, 20 September 2026.
# Navigation and assertions only: no profile edits, submissions, payments or setting changes.
# Eligibility currently opens an introduction without Status; checking eligibility is excluded.
# Native Back skips Preferences and does not leave Wallet on this build; their toolbar
# arrows are used instead. Geometry is verified on the current 1080x2400 Android emulator.
appId: fi.iwa.sakani
name: Account services - read-only profile, wallet, preferences, eligibility, bookings and settings
tags:
  - health-check
env:
  # The account this flow signs in as - defined once, here. Default (no override): 1012204739.
  #   maestro test -e NATIONAL_ID=<10-digit National ID / Iqama> .maestro/regression-readonly/account.yaml
  # A self-referencing default, NOT a literal: on Maestro 2.9.0 a literal here silently beats
  # `-e NATIONAL_ID=...`. Single-quoted because the expression contains ": ".
  #
  # Account identity is verified in Profile before any service is opened.
  # Observed empty states are fixture expectations for this account on PRE-4.7.6-1283.
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1012204739" : String(NATIONAL_ID)}'
---
# STAGE 1 - Shared login and authenticated Account
# Fail fast, before the app is touched, on an empty or malformed override. Dollar-free on
# purpose: a "$" inside ${...} makes Maestro 2.9.0 skip evaluation and pass the assert.
- evalScript: ${console.log('ACCOUNT.YAML TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}
- launchApp:
    clearState: true

# Reuse the journey login helper: it handles onboarding only when needed, Nafath,
# and post-login prompts, then proves authenticated Home with a named greeting.
- runFlow:
    file: ../subflows/login.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}

# Authenticated Home is proven by the helper; wait for its tab bar, then open Account.
#
# NPS COVERAGE (27/09/2026). A bare wait here was NOT enough. The known NPS survey re-presents
# itself moments after authentication and REPLACES Home's content - the hierarchy at such a
# moment holds only the survey, its Scrim and the status bar, so even the tab bar is gone. The
# identical "login returns, then tap Account" sequence failed in wallet.yaml on exactly this
# step (run-logs-nps-fix-v4: `Run ../subflows/login.yaml... COMPLETED` then
# `Tap on "Account\s*Tab 4 of 4"... FAILED` with the survey on screen).
#
# The shared helper is used instead of a longer wait: it owns NPS handling via
# subflows/dismiss-nps.yaml and keeps clearing until this anchor is genuinely reachable. No NPS
# code is inlined here, no assertion is weakened, and the intent is unchanged - still "authenticated
# Home's tab bar must be up before Account is opened".
# The tap itself is retried against the DESTINATION by the shared helper, because the survey can
# return between the dismissal and the tap. No NPS code lives here - the helper calls the one
# shared subflows/dismiss-nps.yaml - and arrival is proven by Account's own screen below.
- runFlow:
    file: ../subflows/open-account-tab.yaml
    env:
      DESTINATION: "My bookings"

# Account reached and genuinely authenticated - "My bookings" exists only for a signed-in
# user, and "Log in" only for a guest.
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 60000
- assertNotVisible: "Log in"


# Reused return proof: a selected Account tab AND an Account-only service row.
# The row alternatives cover both the top and bottom scroll positions.
- runFlow:
    file: ../subflows/account-ready.yaml
# STAGE 2 - Profile details (read-only)
- tapOn: "Profile details"
- extendedWaitUntil:
    visible: "Personal Detail(s)?"
    timeout: 30000
- assertVisible: "Profile"
- assertVisible: "National ID"
- assertVisible: ${NATIONAL_ID}
- assertVisible: "Name"
- assertVisible: "Date of Birth"
- assertVisible: '(Sex|Gender)\s*'
- assertVisible: "Status"
- assertVisible: "Contact Details"
- assertVisible: "Phone Number"
- assertVisible: "Email"
- assertVisible:
    text: '[^\s@]+@[^\s@]+\.[^\s@]+'
    below: "Email"
- scrollUntilVisible:
    element:
      text: "Current Region"
    direction: DOWN
    timeout: 20000
- assertVisible: "Housing Details"
- assertVisible: "Current Housing Type"
- assertVisible: "Current Region"
- assertVisible: "Current City"
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# STAGE 3 - Wallet
- evalScript: ${output.accountService = "(?s)Wallet\\s.*"}
# Reuse this bounded navigation for Account's full-width service rows.
# A complete 996x147 row must be below the header and above Home's tab.
# This rejects off-screen/clipped semantics. Finger UP moves content DOWN.
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Transaction history"
    timeout: 30000
- assertVisible: "Wallet"
- assertVisible: "Available Balance"
- assertVisible: "Reserved Balance"
- assertVisible: "Total Balance"
- assertVisible: "SAR"
- assertVisible:
    text: '[0-9][0-9,.]*'
    below: "Available Balance"
    above: "Reserved Balance"
# Toolbar Back has no label; bounds [0,132][147,279] (1080x2400). Native Back leaves Wallet open.
# Integer pixels: Maestro rejects fractional percentages ("For input string: 8.5").
- tapOn:
    point: "76,204"
    retryTapIfNoChange: false
- runFlow:
    file: ../subflows/account-ready.yaml

# STAGE 4 - Preferences and both child services
- evalScript: ${output.accountService = "Preferences"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: '(?s)Registered interest\sView megaprojects.*'
    timeout: 30000
- assertVisible: "Preferences"
- assertVisible: '(?s)Preference form\sReview form.*'

- tapOn: '(?s)Registered interest\sView megaprojects.*'
- extendedWaitUntil:
    visible: "Your register interest list is empty"
    timeout: 30000
- assertVisible: "Registered interest"
- assertVisible: "Mega projects"
- assertVisible: "Projects"
- assertVisible: "Brokers"
# Toolbar Back returns to Preferences; Android Back skips it.
- tapOn:
    point: "76,204"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: '(?s)Registered interest\sView megaprojects.*'
    timeout: 30000
- assertVisible: "Preferences"
- assertVisible: '(?s)Preference form\sReview form.*'
- tapOn: '(?s)Preference form\sReview form.*'
- extendedWaitUntil:
    visible: "Register interest in projects"
    timeout: 30000
- assertVisible: "Preference form"
- assertVisible: "step 1 of 2"
- assertVisible: "Region"
- assertVisible: "City"
- assertVisible: "Neighborhood"
- assertVisible: "Completion status"
- assertVisible: "Property type"
# Never select a field or tap Next/submit.
- tapOn:
    point: "76,204"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: '(?s)Registered interest\sView megaprojects.*'
    timeout: 30000
- assertVisible: "Preferences"
- assertVisible: '(?s)Preference form\sReview form.*'
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# STAGE 5 - Financial advisory: recommendation is asserted, never started.
- evalScript: ${output.accountService = "Financial advisory"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Get recommendation"
    timeout: 30000
- assertVisible: "Financial advisory"
- assertVisible: "(?s)Beneficiaries\\s.*"
- assertVisible: "(?s)Service Channels\\s.*"
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# STAGE 6 - Eligibility: observed introduction, not an Eligible/Not Eligible decision.
# Status is not rendered for this account. Do not tap Check your eligibility.
- evalScript: ${output.accountService = "(?s)Eligibility checker status.*"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Check your eligibility"
    timeout: 30000
- assertVisible: "Eligibility"
- assertVisible: "Housing options, picked for you"
- assertVisible: "A smoother way to book"
- assertVisible: "See only what fits"
- assertNotVisible: "Status"
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# STAGE 7 - My Bookings: prove all tabs and loaded booking information.
- evalScript: ${output.accountService = "My bookings"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Active\\s*Tab 2 of 4"
    timeout: 30000
- assertVisible: "All\\s*Tab 1 of 4"
- assertVisible: "Completed\\s*Tab 3 of 4"
- assertVisible: "Cancelled\\s*Tab 4 of 4"
- assertVisible: "Unpaid"
- assertVisible: "Ready to sign"
- extendedWaitUntil:
    visible: "(?s).*Unit Type\\s.*Unit code\\s.*Booking date\\s.*"
    timeout: 30000
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# STAGE 8 - Remaining Account services; no cards or business CTAs are opened.
# Ejar contracts
- evalScript: ${output.accountService = "Ejar contracts"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "All \\([0-9]+\\)\\s*Tab 1 of 3"
    timeout: 30000
- assertVisible: "Rental Contracts"
- assertVisible: "Pending \\([0-9]+\\)\\s*Tab 2 of 3"
- assertVisible: "Completed \\([0-9]+\\)\\s*Tab 3 of 3"
- extendedWaitUntil:
    visible: "(?s).*Contract number\\s.*Lessor name\\s.*Tenant name\\s.*Start date\\s.*End date\\s.*"
    timeout: 30000
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# Real estate tax - existing certificate, no issuance or download action.
- evalScript: ${output.accountService = "Real estate tax"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Certificate Issued successfully"
    timeout: 30000
- assertVisible: "First Home VAT Exemption"
- assertVisible: "Status"
- assertVisible: "Checked on"
- assertVisible: "Certificate number"
- assertVisible: "Your VAT certificate has been issued and is ready to download."
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# Rental Behavior Inquiry - paid report request is not executed.
- evalScript: ${output.accountService = "Rental Behavior Inquiry"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Request Rental Behavior Report"
    timeout: 30000
- assertVisible: "Rental Behavior Inquiry"
- assertVisible: "(?s)Beneficiaries\\s.*"
- assertVisible: "(?s)Expected time\\s.*"
- assertVisible: "(?s)Service fee\\s.*"
- assertVisible: "(?s)Service available on\\s.*"
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# Purchased deals - observed empty state.
- evalScript: ${output.accountService = "Purchased deals"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Sorry, there are no purchased deals"
    timeout: 30000
- assertVisible: "Purchased deals"
- assertVisible: "Check latest deal from deals marketplace"
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# Units delivery - observed empty state and currently visible tabs.
- evalScript: ${output.accountService = "Units delivery"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "You don't have any all units delivery form yet"
    timeout: 30000
- assertVisible: "Units Delivery"
- assertVisible: "All\\s*Tab 1 of 5"
- assertVisible: "Pending\\s*Tab 2 of 5"
- assertVisible: "Approved\\s*Tab 3 of 5"
- assertVisible: "Accepted by developer\\s*Tab 4 of 5"
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# Invoices - list data only, no invoice opened or paid.
- evalScript: ${output.accountService = "Invoices"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Unpaid\\s*Tab 2 of 4"
    timeout: 30000
- assertVisible: "Invoices"
- assertVisible: "All\\s*Tab 1 of 4"
- assertVisible: "Paid\\s*Tab 3 of 4"
- assertVisible: "Cancelled\\s*Tab 4 of 4"
- extendedWaitUntil:
    visible: "(?s).*Order type\\s.*Invoice expires\\s.*Amount\\s.*"
    timeout: 30000
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# STAGE 9 - Additional discovered settings; inspect without choosing/saving.
- evalScript: ${output.accountService = "(?s)Language\\s.*"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Select Language"
    timeout: 30000
- assertVisible: "English"
- assertVisible: "Confirm"
- back
- runFlow:
    file: ../subflows/account-ready.yaml
- evalScript: ${output.accountService = "Accessibility"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "(?s)Text size\\s.*"
    timeout: 30000
- assertVisible: "Accessibility"
- assertVisible: "(?s)Text Reader\\s.*"
- assertVisible: "(?s)Color blindness\\s.*"
- back
- runFlow:
    file: ../subflows/account-ready.yaml
- evalScript: ${output.accountService = "App appearance\\s*"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 30000
- assertVisible: "Dark mode"
- assertVisible: "Light mode"
- assertVisible: "(?s)System default\\s.*"
- back
- runFlow:
    file: ../subflows/account-ready.yaml
- evalScript: ${output.accountService = "Regulations and policies"}
- runFlow:
    file: ../subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Eligibility policy"
    timeout: 30000
- assertVisible: "Regulations and policies"
- assertVisible: "Terms & Conditions"
- back
- runFlow:
    file: ../subflows/account-ready.yaml

# Authentication actions are discovered but not executed.
- assertVisible: "Log out"

# STAGE 10 - Top Account services. Finger DOWN moves content UP.
- repeat:
    times: 6
    while:
      notVisible:
        text: "Profile details"
        width: 996
        height: 147
        tolerance: 4
        below:
          text: '(?s)Hello\s.*'
        above:
          text: 'Home\s*Tab 1 of 4'
    commands:
      - swipe:
          start: "50%,40%"
          end: "50%,80%"
          duration: 500
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    text: "Profile details"
    width: 996
    height: 147
    tolerance: 4
    below:
      text: '(?s)Hello\s.*'
    above:
      text: 'Home\s*Tab 1 of 4'
- runFlow:
    file: ../subflows/account-ready.yaml
- assertVisible: "Enable Touch ID"
- tapOn: "Notifications"
- extendedWaitUntil:
    visible: "There is no notification"
    timeout: 30000
- assertVisible: "Notifications Center"
- back
- runFlow:
    file: ../subflows/account-ready.yaml
# Favorites - read-only: Mega projects -> Projects -> Land. Never tap a heart, a card,
# Compare or Explore marketplace. Live labels (21 Sep 2026): All, Mega projects, Projects,
# Land, Units. Chips expose selected=false even when active, so the active category is
# proven by comparing the chip's own pixels with a reference captured on this device;
# a completed tap is not treated as proof.
- tapOn: "Favorites"
- extendedWaitUntil:
    visible: "Land"
    timeout: 30000
- assertVisible: "Favorites"
- assertVisible: "Compare"
- assertVisible: "All"
- assertVisible: "Mega projects"
- assertVisible: "Projects"

# Mega projects
- tapOn: "Mega projects"
- waitForAnimationToEnd:
    timeout: 5000
- assertScreenshot:
    path: ../reference-screenshots/favorites/mega-projects-selected.png
    cropOn:
      text: "Mega projects"
    thresholdPercentage: 95
- runFlow:
    when:
      visible: "Your favorites list is empty"
    commands:
      - assertVisible: "Explore marketplace to find what suit your needs"
      - assertVisible: "Explore marketplace"
# Saved items: no populated-card evidence exists for this account yet, so only the
# absence of the empty state is asserted; add card assertions once one is captured.
- runFlow:
    when:
      notVisible: "Your favorites list is empty"
    commands:
      - assertNotVisible: "Explore marketplace to find what suit your needs"
      - takeScreenshot: favorites-mega-projects-items

# Projects
- tapOn: "Projects"
- waitForAnimationToEnd:
    timeout: 5000
- assertScreenshot:
    path: ../reference-screenshots/favorites/projects-selected.png
    cropOn:
      text: "Projects"
    thresholdPercentage: 95
- assertScreenshot:
    path: ../reference-screenshots/favorites/mega-projects-unselected.png
    cropOn:
      text: "Mega projects"
    thresholdPercentage: 95
- runFlow:
    when:
      visible: "Your favorites list is empty"
    commands:
      - assertVisible: "Explore marketplace to find what suit your needs"
      - assertVisible: "Explore marketplace"
- runFlow:
    when:
      notVisible: "Your favorites list is empty"
    commands:
      - assertNotVisible: "Explore marketplace to find what suit your needs"
      - takeScreenshot: favorites-projects-items

# Land
- tapOn: "Land"
- waitForAnimationToEnd:
    timeout: 5000
- assertScreenshot:
    path: ../reference-screenshots/favorites/land-selected.png
    cropOn:
      text: "Land"
    thresholdPercentage: 95
- assertScreenshot:
    path: ../reference-screenshots/favorites/projects-unselected.png
    cropOn:
      text: "Projects"
    thresholdPercentage: 95
- runFlow:
    when:
      visible: "Your favorites list is empty"
    commands:
      - assertVisible: "Explore marketplace to find what suit your needs"
      - assertVisible: "Explore marketplace"
- runFlow:
    when:
      notVisible: "Your favorites list is empty"
    commands:
      - assertNotVisible: "Explore marketplace to find what suit your needs"
      - takeScreenshot: favorites-land-items
- back
- runFlow:
    file: ../subflows/account-ready.yaml
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Help & Support"
    timeout: 30000
- assertVisible: "Read frequently asked questions"
- assertVisible: "(?s)Contact Us\\s.*"
- assertVisible: "(?s)Phone call\\s.*"
- assertVisible: "(?s)Send us an email\\s.*"
- assertVisible: "(?s)Send us a message on Whatsapp\\s.*"
- assertVisible: "(?s)Send us a message on X\\s.*"
- assertVisible: "(?s)Live sign language support\\s.*"
- back
- runFlow:
    file: ../subflows/account-ready.yaml

- takeScreenshot: account-services-complete
