# Home regression - READ-ONLY. Navigation and assertions only: nothing is reserved, paid,
# confirmed, cancelled, signed or requested, and no account data is changed.
#
# Guest half (cleared launch):
#   HOME-001  Home renders the four tabs and real content (absorbs HOME-002/003/004, QA-001)
#   HOME-005  the featured unit opens Unit Details (absorbs UNIT-001, UNIT-006)
#   SRV-001   Services categories (absorbs SRV-002, SRV-005, MTG-001, VCH-001)
#   HOME-006  guest half: Login / Sign up offered, nobody greeted by name
# Authenticated half (shared subflows/login.yaml, from the guest Home just asserted):
#   HOME-006  authenticated half: Home greets the account holder by name
#   QA-004    Rental Behavior discloses fee, time and beneficiaries before purchase (absorbs QA-005)
# Built up across both halves:
#   NAV-001   Android Back unwinds each drill-down (absorbs NAV-003 bottom nav, NAV-004 sheet
#             closes on Back, NAV-005 sheet closes on the scrim). Wallet is excluded: Back does
#             not leave Wallet on this build (defect D-31).
#
# Deliberately NOT asserted: banner carousel content (HOME-002, rotates) and featured-unit
# prices (HOME-004, unstable PREPROD data - D-08).
#
# The launch clears state so the guest half is repeatable. A SIGSEGV/SIGABRT on the Flutter
# raster thread after hours of emulator uptime was once blamed on clearState; it was emulator
# graphics degradation and does not reproduce after a cold boot (re-confirmed 21/09/2026).
appId: fi.iwa.sakani
name: Home - HOME-001 tabs, HOME-005 featured unit, SRV-001 Services catalogues, HOME-006 personalisation, QA-004 Rental Behavior fee, NAV-001 back navigation
tags:
  - health-check
env:
  # The account HOME-006 / QA-004 sign in as - defined once, here. Default (no override): 1000011487.
  #   maestro test -e NATIONAL_ID=<10-digit National ID / Iqama> .maestro/regression-readonly/home.yaml
  # A self-referencing default, NOT a literal: on Maestro 2.9.0 a literal here silently beats
  # `-e NATIONAL_ID=...`. Single-quoted because the expression contains ": ".
  # ACCOUNT DATA: any account that can sign in; nothing account-specific is asserted.
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1000011487" : String(NATIONAL_ID)}'
---
# Fail fast, before the app is touched, on an empty or malformed override. Dollar-free on
# purpose: a "$" inside ${...} makes Maestro 2.9.0 skip evaluation and pass the assert.
- evalScript: ${console.log('HOME.YAML TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}
- launchApp:
    clearState: true

# A cleared launch replays onboarding and can raise promos, error dialogs, the compare coach
# mark or the survey, and a cold start can take over a minute to paint. The shared helper
# polls, clears whichever overlay is on top and stops as soon as the guest header is up - the
# same call and anchor subflows/login.yaml makes, so there is one overlay policy.
- runFlow:
    file: ../subflows/clear-overlays.yaml
    env:
      ANCHOR: "(?s).*Login / Sign up.*"

# HOME-001 assertion. Each tab exposes one accessibility label spanning two lines, e.g.
# "Home\nTab 1 of 4"; \s* crosses that newline without needing DOTALL.
- extendedWaitUntil:
    visible: 'Home\s*Tab 1 of 4'
    timeout: 30000
- assertVisible: 'Explore\s*Tab 2 of 4'
- assertVisible: 'Services\s*Tab 3 of 4'
- assertVisible: 'Account\s*Tab 4 of 4'

# Home rendered content, not an empty shell. "Quick Access" is the one section label present
# in both the guest and authenticated Home.
- assertVisible: "Quick Access"

# --- HOME-005: the featured unit card opens Unit Details.
# Absorbs UNIT-001 (details render) and UNIT-006 (regulatory badge).

# Home's hero content rotates, so the featured section can sit below the fold. Scroll to
# it rather than assuming it is on screen.
- scrollUntilVisible:
    element:
      text: 'Discover featured unit in the market\s*'
    direction: DOWN
    timeout: 30000

# The card's own accessibility label embeds the price and the unit code - both dynamic -
# so it is targeted by position relative to the static section subtitle directly above it
# rather than by its text or by coordinates.
- tapOn:
    below:
      text: 'Discover featured unit in the market\s*'

# Unit Details reached. All three assertions are static: the unit title, price and view
# count on this screen are dynamic and deliberately not asserted. The regulatory badge
# (UNIT-006) is labelled "Approved by Wafi" on STG-4.7.5-1278 and "Licensed by" on
# PRE-4.7.6-1283, where the licensor itself is a logo exposing no text - so both labels
# are matched. It sits inside one large combined node, hence the regex. The assertion
# still proves the accreditation block rendered.
- extendedWaitUntil:
    visible: "Mortgage Calculator"
    timeout: 30000
- assertVisible: "Reserve unit"
- assertVisible: "(?s).*(Approved by Wafi|Licensed by).*"

# --- NAV-001: Android Back unwinds to the previous screen. Absorbs NAV-003 (the bottom nav
# is reachable everywhere), NAV-004 (a modal sheet closes on back) and NAV-005 (tapping the
# scrim closes a sheet). The case is built up across this flow at each real screen change
# rather than as an isolated section, so every drill-down below is also a back test.
#
# Wallet is deliberately excluded: Android Back does not work there at all (defect D-31), so
# including it would fail this case for a known, separately tracked product defect.
#
# First unwind: Unit Details -> Home. Unit Details carries no bottom navigation, so the tab
# bar reappearing is itself proof the stack popped rather than the screen merely repainting.
- back
- extendedWaitUntil:
    visible: 'Home\s*Tab 1 of 4'
    timeout: 30000
- assertVisible: "Quick Access"
- assertNotVisible: "Reserve unit"

# --- SRV-001: the Services tab lists the service categories.
# Absorbs SRV-002 (Housing Support catalogue), SRV-005 (a product detail opens),
# MTG-001 (Professional Services catalogue) and VCH-001 (the More hub).
#
# Verified to work without a session, so it runs in the guest half of this flow.
- tapOn: 'Services\s*Tab 3 of 4'
- extendedWaitUntil:
    visible: "Categories"
    timeout: 30000

# The three category cards. Each is one node combining title and description, so the title
# is matched inside it rather than as a standalone string.
- assertVisible: "(?s).*Housing Support Products.*"
- assertVisible: "(?s).*Professional Services.*"
- assertVisible: "(?s).*More.*vouchers.*"

# NAV-003: the bottom nav stays reachable on the Services tab.
- assertVisible: 'Home\s*Tab 1 of 4'
- assertVisible: 'Account\s*Tab 4 of 4'

# SRV-002: the Housing Support catalogue lists its six products.
- tapOn: "(?s).*Housing Support Products.*"
- extendedWaitUntil:
    visible: "Explore Housing Support Products"
    timeout: 30000
- assertVisible: "(?s).*Off-plan Units.*"
- assertVisible: "(?s).*Ready Units.*"
- assertVisible: "(?s).*Land support.*"
- assertVisible: "(?s).*Eligibility Checker.*"
- assertVisible: "(?s).*Real estate tax exemption.*"
- assertVisible: "(?s).*Financial advisory.*"

# SRV-005: a product opens its detail page. It is served in a WebView, historically the part
# of the app most exposed to TLS interception on this network. A blank page is NOT
# automatically an environment failure: classify it only after checking the WebView's
# requests in logcat and whether the page loads manually on the same device.
- tapOn: "(?s).*Off-plan Units.*"
# The page is served in a WebView. Wait on its rendered content rather than on the CTA:
# a blank WebView (the TLS-interception failure mode this case has always guarded) fails
# here, which keeps that signal intact.
- extendedWaitUntil:
    visible: "Product Advantages"
    timeout: 60000

# Build PRE-4.7.6-1283 raises a cookie-consent modal over the lower half of this page
# (bounds [0,1407]-[997,2106]), which is exactly where the CTA sits. "Reject cookies" is
# used rather than "Accept all cookies": it dismisses the modal just as reliably (verified
# live) without storing tracking cookies. It is a WebView preference only - no account,
# booking or business data is touched.
- runFlow:
    when:
      visible: "Reject cookies"
    commands:
      - tapOn: "Reject cookies"
      - waitForAnimationToEnd:
          timeout: 5000

# SRV-005 expected result, unchanged: the product detail page exposes its "View units"
# CTA. On this build that CTA renders BELOW THE FOLD, and extendedWaitUntil does not
# scroll - which is the whole reason this step failed. Verified live: the CTA exists, is
# clickable, and is reached by scrolling. It is NOT replaced by "Off-plan Projects",
# which is the breadcrumb and page heading (clickable=false), so the selector is kept.
- scrollUntilVisible:
    element:
      text: "View units"
    direction: DOWN
    timeout: 45000
- assertVisible: "Close"

# NAV-001: back unwinds the product detail to the catalogue...
- back
- extendedWaitUntil:
    visible: "Explore Housing Support Products"
    timeout: 30000
- assertNotVisible: "View units"

# ...and the catalogue back to the Services tab.
- back
- extendedWaitUntil:
    visible: "Categories"
    timeout: 30000

# MTG-001: the Professional Services catalogue lists its four services.
- tapOn: "(?s).*Professional Services.*"
- extendedWaitUntil:
    visible: "Explore Professional Services"
    timeout: 30000
- assertVisible: "(?s).*Farz certificate.*"
- assertVisible: "(?s).*Online lending.*"
- assertVisible: "(?s).*Mortgage Calculator.*"
- assertVisible: "(?s).*Resell offplan units.*"

- back
- extendedWaitUntil:
    visible: "Categories"
    timeout: 30000

# VCH-001: the More hub lists its four sections.
- tapOn: "(?s).*More.*vouchers.*"
- extendedWaitUntil:
    visible: "Explore More"
    timeout: 30000
- assertVisible: "(?s).*Sakani News.*"
- assertVisible: "(?s).*Asset and Facility Management.*"
- assertVisible: "(?s).*Sakani Offers.*"
- assertVisible: "(?s).*Sakani Metaverse.*"

- back
- extendedWaitUntil:
    visible: "Categories"
    timeout: 30000
# --- end SRV-001

# --- HOME-006, guest half: an unauthenticated Home offers sign-in and does not greet anyone.
# Asserted here, before logging in, so the two halves are compared within one run.
- tapOn: 'Home\s*Tab 1 of 4'
- extendedWaitUntil:
    visible: "(?s).*Login / Sign up.*"
    timeout: 30000
# Build PRE-4.7.6-1283 greets with "Hello, <name>" where earlier builds used the
# time-of-day form. Both are excluded here. The ",\s*\S" tail on the Hello branch is
# deliberate: a guest surface legitimately renders a bare "Hello" with no name, and it is
# the NAME that would prove a personalised greeting leaked into the guest Home. The
# time-of-day branch keeps its original unrestricted form, so this is not weakened.
- assertNotVisible: '(?si)(Good (morning|afternoon|evening).*|Hello,\s*\S.*)'

# Authenticate through the shared helper, exactly as account.yaml and the Full Journey do. Its
# precondition - an unauthenticated app on guest Home - is the state the guest half above has
# just asserted, so no relaunch is needed. It owns Nafath, the contact-details prompts, the
# Sharrai/weekly-deal promo, biometrics and the login-page bounce recovery, and returns on an
# authenticated Home.
- runFlow:
    file: ../subflows/login.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}

# --- HOME-006, authenticated half: the same Home is now personalised. Kept even though the
# helper proves a greeting, because personalisation of Home is what this case validates.
# The wait is on the greeting *followed by a name* (Arabic test data, so matched by shape):
# the header briefly renders "Hello, " before the name arrives.
#
# NPS (28/09/2026): the survey can present right after authentication and, while it is up, it
# replaces Home's whole accessibility tree - two bare waits here had no NPS handling. The shared
# helper waits for the named greeting while handing any survey to subflows/dismiss-nps.yaml (the
# one NPS implementation), then ONE read proves the named greeting above the selected Home tab -
# the same two facts the two waits proved, with no gap for the survey to land in.
- runFlow:
    file: ../subflows/clear-overlays.yaml
    env:
      ANCHOR: '(?si)(Hello|Good (morning|afternoon|evening)),\s*\S.*'
- assertVisible:
    text: '(?si)(Hello|Good (morning|afternoon|evening)),\s*\S.*'
    above:
      text: 'Home\s*Tab 1 of 4'
      selected: true

# The guest entry point is gone - the counterpart of the guest-half assertion above.
- assertNotVisible: "(?s).*Login / Sign up.*"
# --- end HOME-006

# --- QA-004: a paid service discloses its fee before purchase.
# Absorbs QA-005 (fee stated before purchase).
#
# Requires a session: tapping the service as a guest routes to the login screen instead of
# opening it, which is why this sits after the login above.
#
# Reached from Account rather than from the Home "Quick Access" tile that the case
# description names. Quick Access is dependable on the guest Home but NOT on the
# authenticated one: the authenticated dashboard is server-driven and its section set varies
# between sessions on the same account - observed with Quick Access present in one run and
# entirely absent in the next, scrolled to the "Edit Dashboard" footer to confirm. Account is
# a bottom-nav tab and lists the same service in a fixed position under Personal Activities,
# so it is the stable route to the identical sheet. The Home tile is still covered as an
# entry point by HOME-001/HOME-003 on the guest Home.
#
# The service is NEVER requested - the "Request ... Report" CTA would charge SAR 50
# against the wallet. It is asserted as present and left untouched.
#
# Authenticated Home -> Account is the transition the NPS survey is known to break (account.yaml,
# wallet.yaml), so it goes through the shared Account helper: NPS handled, tap retried, arrival
# proven by "My bookings" - never by the tap completing.
- runFlow:
    file: ../subflows/open-account-tab.yaml
    env:
      DESTINATION: "My bookings"

# The row sits below the fold under Personal Activities; on Account its label is exactly the
# service name. Opened through the same bounded row navigation account.yaml uses: it taps at
# once when the row is already fully on screen, otherwise swipes at most six times, and only
# taps a complete row inside the viewport (Flutter can expose off-screen rows).
- evalScript: ${output.accountService = "Rental Behavior Inquiry"}
- runFlow:
    file: ../subflows/open-account-service.yaml

# RENAMED on PRE-4.7.6-1283: this service is now "Rental Behavior" throughout, so the
# sheet title no longer differs from the row that opens it and can no longer prove the
# sheet opened. The sheet-only purchase CTA is used as the discriminator instead - it
# exists on the sheet and nowhere on the Account screen underneath, so this still proves
# the sheet actually opened rather than merely that the row is on screen.
- extendedWaitUntil:
    visible: "Request (your Rental Score|Rental Behavior) Report"
    timeout: 30000

# QA-004 / QA-005 expected result: the SAR 50 fee is disclosed up front. The fee sits in one
# node as "Service fee / SAR / 50" across separate lines, hence \s* between the parts.
- assertVisible: 'Service fee\s*SAR\s*50'
- assertVisible: 'Expected time\s*Immediate'
- assertVisible: 'Beneficiaries\s*Citizens, Residents'

# The purchase CTA is exposed but deliberately not tapped.
- assertVisible: "Request (your Rental Score|Rental Behavior) Report"

# --- NAV-004: a modal sheet closes on Android Back, leaving the screen underneath usable.
- back
- extendedWaitUntil:
    notVisible: "Request (your Rental Score|Rental Behavior) Report"
    timeout: 30000
- assertVisible: "My bookings"

# --- NAV-005: tapping the scrim also closes the sheet.
#
# The sheet is re-opened so the scrim gets its own dismissal rather than sharing NAV-004's.
# The scrim is a real node but only [0,0][1080,234] - the strip above the sheet - and its
# centre falls inside the system status bar, so tapping the element sends the tap to SystemUI
# and the sheet stays open. The tap is therefore placed by point, inside the scrim band but
# below the status bar.
- tapOn: "Rental Behavior Inquiry"
- extendedWaitUntil:
    visible: "Request (your Rental Score|Rental Behavior) Report"
    timeout: 30000
- tapOn:
    point: "50%,8%"
- extendedWaitUntil:
    notVisible: "Request (your Rental Score|Rental Behavior) Report"
    timeout: 30000
- assertVisible: "My bookings"

# NAV-003: the bottom nav survived the whole traversal.
- assertVisible: 'Home\s*Tab 1 of 4'
- assertVisible: 'Explore\s*Tab 2 of 4'
- assertVisible: 'Services\s*Tab 3 of 4'
- assertVisible: 'Account\s*Tab 4 of 4'
# --- end QA-004 / NAV-001
