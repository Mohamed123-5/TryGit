appId: fi.iwa.sakani
name: PROBE - does this account hold a Completed booking on PRE, and how did the login behave
env:
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1000011485" : String(NATIONAL_ID)}'
---
# READ-ONLY. Signs in, opens My Bookings, switches tabs. It opens no booking, creates
# nothing, cancels nothing and pays for nothing.
#
# THIS PROBE ANSWERS TWO OPEN ITEMS AT ONCE, because both live in the same run:
#
#   BKG-011 - the case expects a Completed booking, and was re-baselined on STG data. On PRE
#             1000011485 has none (verified 10/09). Which PRE account, if any, satisfies the
#             precondition is a question only a read of each candidate can answer.
#
#   The login window - every run drives subflows/login.yaml, so it is also one more
#             observation of how often the keyboard-covered promo stack forms, whether the
#             new Back guard clears it, and whether the run bounces back to the login page
#             after Nafath. Those needed repetitions anyway; taking them here costs nothing.
#
# Nothing about the outcome is asserted. Both renders of the Completed tab - cards or the
# empty state - are real answers about the account, and asserting either would turn a
# question into a manufactured failure.
- evalScript: ${console.log('PROBE COMPLETED TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}

- launchApp:
    clearState: true
- runFlow:
    file: subflows/login.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}
- evalScript: "${console.log('PROBE COMPLETED: login window cleared, authenticated Home reached')}"

- tapOn: 'Account\s*Tab 4 of 4'
- runFlow:
    file: subflows/clear-overlays.yaml
    env:
      ANCHOR: "My bookings"
- tapOn: "My bookings"
- extendedWaitUntil:
    visible: "My Bookings"
    timeout: 45000

# --- COMPLETED tab. Waits for the tab to have finished loading - either a card or the empty
# state - rather than for a fixed budget, which is what captured a skeleton list last time.
- tapOn: 'Completed\s*Tab 3 of 4'
- extendedWaitUntil:
    visible: "(?s).*(Unit code|don.t have any completed booking).*"
    timeout: 60000
- takeScreenshot: probe-completed-tab
- evalScript: "${console.log('PROBE COMPLETED: Completed tab captured')}"

# --- ALL tab, so the account's full booking picture is on record next to the answer.
- tapOn: 'All\s*Tab 1 of 4'
- extendedWaitUntil:
    visible: "(?s).*(Unit code|don.t have any booking).*"
    timeout: 60000
- takeScreenshot: probe-completed-all-tab
- evalScript: "${console.log('PROBE COMPLETED: All tab captured')}"
