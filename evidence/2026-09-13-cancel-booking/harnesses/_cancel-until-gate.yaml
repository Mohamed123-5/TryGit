# Cancel Booking — cancel ONE Active booking whose sales contract is NOT signed.
#
#   Login (NATIONAL_ID) -> account proven by National ID -> Account -> My bookings -> Active
#     -> open the Active booking -> PROVE it is Active + unsigned, capture its unit code and
#        invoice number -> Cancel booking -> "Yes, cancel my booking" -> reason -> "Confirm
#        cancellation" -> "Yes" -> the product's confirmation names the SAME unit
#     -> relaunch -> Active no longer lists that unit -> Cancelled lists it.
#
#   maestro test -e NATIONAL_ID=<10-digit National ID / Iqama> .maestro/cancel-booking.yaml
#
# --- THIS FLOW CANCELS A REAL BOOKING, ON PURPOSE -------------------------------------------
# The product's own dialog says it: "The booking fee is not refunded when you cancel the
# booking". Run it only on a PRE test account whose Active booking may be cancelled.
#
# --- WHAT IT REFUSES TO CANCEL -------------------------------------------------------------
# Everything below the SAFETY GATE is unreachable unless ALL of this was read from the product:
#   * the booking card is in My bookings -> Active and reads "\nActive\n" - a Completed or
#     Cancelled card renders "\nCompleted\n" / "\nCancelled\n" and never matches;
#   * the booking's own progress card shows "2..9 steps left". The lifecycle is: pay the fee,
#     select a payment method, sign the contract, pay the first installment. Unpaid shows
#     "4 steps left", paid "3 steps left", payment method chosen "2 steps left" (09/09/2026
#     dumps unpaid.xml, bkdetail.xml; 13/09/2026 unit 999-205); once the contract is SIGNED
#     only the installment is left - "1 steps left" - and the price-quotation banner with
#     "Extend PQ Period" appears on top (13/09/2026, units 999-147 and 999-288). Either signed
#     marker blocks the gate;
#   * its Documents, read at the bottom of the booking next to "Cancel booking", show no
#     "Signed" and no "Price quotation" (PRE issues the quotation only AT signature). A drafted
#     contract reads "Sales contract" / "Unsigned" there (dump u3-final.xml) - "Signed" is a
#     full match, so "Unsigned" can never satisfy it;
#   * its unit code was captured from the card, so the cancellation can be followed by identity.
# If any of that fails - no Active booking, a signed one, or anything that cannot be proven -
# the flow logs "No active unsigned booking available for cancellation." and STOPS at the gate
# assertion. Nothing is tapped. It never goes looking for some other booking to cancel instead.
#
# ONE ACTIVE BOOKING: the product allows a single active booking per account (a second
# reservation is refused with "Active booking detected!"), so the Active tab holds at most one
# card and it is the one inspected. Should that ever change, index 0 is inspected and must pass
# the whole gate on its own.
#
# --- NEVER ---------------------------------------------------------------------------------
# No reservation, no payment, no payment method, no contract signature, no OTP, no NPS/CSAT
# Submit or rating. On the success screen neither "View booking" nor "Reserve unit" is tapped
# (the latter would start a new reservation) - the flow relaunches instead. No overlay helper
# runs between the "Cancel booking" tap and the product's confirmation, so a real product error
# in that window is never cleared away: the flow fails on it, with the error in the screenshot.
#
# The cancellation screens and texts are the ones proven by subflows/ensure-no-active-booking.yaml
# (09/09/2026, booking 01-01-0504-999-368, evidence/2026-09-09-stage0-cancel-branch).
appId: fi.iwa.sakani
name: CANCEL UNTIL GATE - read-only probe (cancel-booking.yaml cut at its safety gate)
env:
  # Same self-referencing form as full-journey.yaml: a literal here silently BEATS `-e` on
  # Maestro 2.9.0. There is NO default account - unsupplied resolves to "" and the fail-fast
  # guard below stops the run before the app is launched.
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "" : String(NATIONAL_ID)}'
---
# ==========================================================================================
# 1. LOGIN - fail fast on NATIONAL_ID, then prove which account is signed in
# ==========================================================================================
- evalScript: ${console.log('CANCEL BOOKING TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- evalScript: ${output.targetNationalId = String(NATIONAL_ID)}
# Dollar-free on purpose (a second "$" inside ${...} makes Maestro 2.9.0 skip the check and pass):
# exactly 10 characters, digits only, first digit 1 (National ID) or 2 (Iqama).
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}

- launchApp:
    clearState: true
- runFlow:
    file: subflows/login.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}

# Home -> Account. An account that holds a booking can get the NPS survey on Home, and on Home
# it re-opens by itself about 10 s after every close (evidence/2026-09-13-nps-close), so this
# is full-journey.yaml's LEAVE HOME block: clear the rest, close the survey with its X, and tap
# Account at once. Bounded at 5 rounds; Submit and ratings are never tapped.
- repeat:
    times: 5
    while:
      notVisible: "My bookings"
    commands:
      - evalScript: ${output.anchorOptional = true}
      - evalScript: ${output.npsLeftToCaller = true}
      - runFlow:
          file: subflows/clear-overlays.yaml
          env:
            ANCHOR: '(?s)(Account\s*Tab 4 of 4|.*would you recommend benefiting from Sakani.*)'
      - evalScript: ${output.anchorOptional = false}
      - evalScript: ${output.npsLeftToCaller = false}
      - runFlow:
          when:
            visible: "(?s).*would you recommend benefiting from Sakani.*"
          commands:
            - runFlow:
                when:
                  notVisible: '(?s)(.*There.s something wrong.*|.*the service is down.*|Error!)'
                commands:
                  - runFlow:
                      when:
                        visible: "Submit"
                      commands:
                        - evalScript: "${console.log('LEAVE HOME (after login) - NPS up, closing it with its X, then Account at once')}"
                        - tapOn:
                            point: "73,1434"
                            retryTapIfNoChange: false
      - tapOn:
          text: 'Account\s*Tab 4 of 4'
          optional: true
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 60000

# WHO IS SIGNED IN - from the profile's own "National ID" field (records output.profileNationalId
# only after it matched). The gate needs all three records to agree before any booking is opened.
- runFlow:
    file: subflows/verify-signed-in-account.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}
- assertTrue: ${output.loginNationalId === output.targetNationalId && output.targetNationalId === String(NATIONAL_ID) && output.profileNationalId === output.targetNationalId}

# ==========================================================================================
# 2. NAVIGATION - Account -> My bookings -> Active
# ==========================================================================================
- runFlow:
    file: subflows/clear-overlays.yaml
    env:
      ANCHOR: "My bookings"
- tapOn: "My bookings"
- extendedWaitUntil:
    visible: "My Bookings"
    timeout: 45000
- assertVisible: 'Active\s*Tab 2 of 4'
- assertVisible: 'Cancelled\s*Tab 4 of 4'
- tapOn: 'Active\s*Tab 2 of 4'
# The tabs paint before the list arrives: wait for a card OR the empty state, never a bare screen.
- extendedWaitUntil:
    visible: "(?s).*(\nActive\n.*Unit code|don.t have any active booking).*"
    timeout: 60000
- takeScreenshot: cancel-00-active-tab-before

# ==========================================================================================
# 3. SELECT AND PROVE - the booking must be Active AND its sales contract NOT signed
# ==========================================================================================
- evalScript: ${output.cancelAllowed = false}
- evalScript: ${output.unitCode = ""}
- evalScript: ${output.invoiceNumber = ""}
- evalScript: ${output.preSignatureSteps = false}
- evalScript: ${output.signedEvidence = false}
- evalScript: ${output.unsignedDocument = false}

- runFlow:
    when:
      visible: "(?s).*don.t have any active booking.*"
    commands:
      - evalScript: "${console.log('CANCEL BOOKING - the Active tab is empty')}"

- runFlow:
    when:
      visible: "(?s).*\nActive\n.*Unit code.*"
    commands:
      # The identifier comes from the Active card itself, before anything is opened:
      # "<project>\nActive\nPaid\nUnit Type\n...\nUnit code\n01-01-0504-999-132\n...".
      - copyTextFrom:
          text: "(?s).*\nActive\n.*Unit code.*"
          index: 0
      - evalScript: '${output.unitCode = (String(maestro.copiedText).match(/Unit code\s*([0-9]{2}(-[0-9]+)+)/) || ["", ""])[1]}'
      - evalScript: "${console.log('CANCEL BOOKING - Active card, unit code [' + output.unitCode + ']')}"
      - tapOn:
          text: "(?s).*\nActive\n.*Unit code.*"
          index: 0
      - extendedWaitUntil:
          visible: "Booking Details"
          timeout: 45000
      # The progress card paints first, at the top - it is read before anything is scrolled.
      - extendedWaitUntil:
          visible: "(?s).*steps? left.*"
          timeout: 45000
      - takeScreenshot: cancel-01-booking-top-progress

      # Pre-signature progress: 2..9 steps left.
      - runFlow:
          when:
            visible: "[2-9] steps left"
          commands:
            - evalScript: ${output.preSignatureSteps = true}
      # Signed markers on the progress card.
      - runFlow:
          when:
            visible: "1 steps? left"
          commands:
            - evalScript: ${output.signedEvidence = true}
      # The price-quotation banner ("Review the PQ ... Extend PQ Period") exists only once the PQ
      # has been issued, i.e. at signature. NOT "Pay first installment": the progress card lists
      # it as a FUTURE step on an unsigned booking too (1000011487, unit 999-205, 13/09/2026:
      # "2 steps left", "Sign contract" undated, "Pay first installment" listed).
      - runFlow:
          when:
            visible: "Extend PQ Period"
          commands:
            - evalScript: ${output.signedEvidence = true}

      # The invoice number sits in Booking Details, BELOW the progress card - and below the fold
      # when that card is long (a signed booking lists every step: read-only probes 13/09/2026
      # 14:25 and 14:29 found "Invoice number" absent from the hierarchy until scrolled to).
      - scrollUntilVisible:
          element:
            text: "Invoice number"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Invoice number"
      - copyTextFrom:
          text: "[0-9]{10,}"
          below:
            text: "Invoice number"
      - evalScript: '${output.invoiceNumber = String(maestro.copiedText)}'
      - takeScreenshot: cancel-01b-booking-invoice

      # Only a booking that already looks unsigned is scrolled to its bottom, where Documents and
      # "Cancel booking" sit together (09/09/2026 dump docs.xml): no "Signed", no "Price quotation".
      - runFlow:
          when:
            true: ${output.preSignatureSteps === true && output.signedEvidence !== true}
          commands:
            - scrollUntilVisible:
                element:
                  text: "Cancel booking"
                direction: DOWN
                timeout: 30000
            - runFlow:
                when:
                  visible: "Signed"
                commands:
                  - evalScript: ${output.signedEvidence = true}
            - runFlow:
                when:
                  visible: "Price quotation"
                commands:
                  - evalScript: ${output.signedEvidence = true}
            - runFlow:
                when:
                  visible: "Unsigned"
                commands:
                  - evalScript: ${output.unsignedDocument = true}
            - takeScreenshot: cancel-02-documents-and-cancel-button

- evalScript: ${output.cancelAllowed = output.preSignatureSteps === true && output.signedEvidence !== true && /^[0-9]{2}(-[0-9]+)+/.test(output.unitCode)}
- evalScript: "${console.log('CANCEL BOOKING DECISION - unit [' + output.unitCode + '] invoice [' + output.invoiceNumber + '] preSignatureSteps=' + output.preSignatureSteps + ' signedEvidence=' + output.signedEvidence + ' unsignedDocument=' + output.unsignedDocument + ' cancelAllowed=' + output.cancelAllowed)}"
- runFlow:
    when:
      true: ${output.cancelAllowed !== true}
    commands:
      - evalScript: "${console.log('No active unsigned booking available for cancellation.')}"
      - takeScreenshot: cancel-STOP-no-active-unsigned-booking

# --- SAFETY GATE. Nothing below this line runs unless the booking was proven Active + unsigned
# above. When it was not, the run stops HERE (a failed assertion, deliberately not a pass) with
# the reason in the log line just before it, and no booking has been touched.
- assertTrue: ${output.cancelAllowed === true}