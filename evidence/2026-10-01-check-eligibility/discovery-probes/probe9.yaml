# PROBE: sign in as the probe-registered generated user 1617798968 (not a business account),
# Eligibility -> Step 1 Terms accepted -> capture Step 2 while scrolling. Step 2 is NOT filled.
appId: fi.iwa.sakani
name: PROBE - step 2 answered No, step 3 discovery
---
- launchApp:
    clearState: true
- runFlow:
    file: D:/Automation/Maestro-Mobile/.maestro/subflows/login.yaml
    env:
      NATIONAL_ID: "1617798968"
- runFlow:
    file: D:/Automation/Maestro-Mobile/.maestro/subflows/open-account-tab.yaml
    env:
      DESTINATION: "My bookings"
- evalScript: ${output.accountService = "(?s)Eligibility checker status.*"}
- runFlow:
    file: D:/Automation/Maestro-Mobile/.maestro/subflows/open-account-service.yaml
- extendedWaitUntil:
    visible: "Check your eligibility"
    timeout: 30000
- tapOn: "Check your eligibility"
- extendedWaitUntil:
    visible: "Step 1 of 3"
    timeout: 30000
- tapOn: "I have read and understood the terms and conditions of the contract.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: probe8-1-terms-ticked
- runFlow:
    optional: true
    commands:
      - assertVisible: "DUMP-TERMS-TICKED"
- tapOn:
    text: "Accept and continue"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Step 2 of 3"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "No"
    below: "1. Have you or any of your dependents resided outside.*"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "No"
    below: "2. Do you or your family have financial assets.*"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "No"
    below: "3. Did you or any of your dependents own a house title.*"
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: probe9-1-step2-answered
- runFlow:
    optional: true
    commands:
      - assertVisible: "DUMP-STEP2-ANSWERED"
- tapOn:
    text: "Continue"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Step 3 of 3"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: probe9-2-step3-a
- runFlow:
    optional: true
    commands:
      - assertVisible: "DUMP-STEP3-A"
- swipe:
    start: "50%,75%"
    end: "50%,35%"
    duration: 700
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: probe9-3-step3-b
- runFlow:
    optional: true
    commands:
      - assertVisible: "DUMP-STEP3-B"
- assertVisible: "PROBE-END-MARKER-NOT-PRESENT"
