# Cancel Booking — cancel the FIRST booking at the top of My bookings -> Active.
#
#   maestro test -e NATIONAL_ID=<10-digit National ID / Iqama> .maestro/e2e/cancel-booking.yaml
#
# NATIONAL_ID is the ONLY input. It defaults to 1000011487 (standardised 14/09/2026) and `-e` always
# wins. THE DEFAULT IS LIVE: a run without `-e` cancels the first Active booking of that account.
# An empty or malformed value stops at the first steps below - BEFORE the app is launched.
#
#   Login -> account proven by National ID -> Account -> My bookings -> Active
#     -> open the FIRST card at the top of the list (index 0)
#     -> scroll down inside Booking Details to "Cancel booking" -> tap it
#     -> paid booking: "Yes, cancel my booking" on the fee-not-refunded dialog (required);
#        zero-fee booking: the product goes straight to the reason screen (observed 29/09/2026)
#     -> reason "Unit area", its selected state proven -> "Confirm cancellation"
#     -> the final confirmation, if one appears -> "Yes"
#     -> leave the success screen with "View booking" -> My Bookings -> Cancelled: the same
#        booking is listed there with its cancellation date (same session, no relaunch).
#
# --- HOW THE BOOKING IS CHOSEN (14/09/2026, by request) --------------------------------------
# The first card at the TOP of the Active list, by position, and nothing else. The flow does NOT
# choose by creation or booking date, by unit code, by invoice number, or by sales-contract
# status; it does not read the contract status at all, and it never scans or compares other
# bookings. The unit code IS copied from that first card afterwards - purely as the record used
# to prove, at the end, that THIS booking is the one that was cancelled - never to pick it.
#
# NO FALLBACK. If the first card cannot be opened, the run FAILS at the step that could not be
# performed. It never tries the second booking.
#
# --- THIS FLOW CANCELS A REAL BOOKING, ON PURPOSE -------------------------------------------
# The product's own dialog says it: "The booking fee is not refunded when you cancel the
# booking". Run it only on a PRE test account whose first Active booking may be cancelled.
#
# --- WHEN IT STOPS INSTEAD -------------------------------------------------------------------
#   no Active booking at all -> "No active bookings available for cancellation." and the gate
#   below fails, deliberately not a pass, with nothing tapped on any cancellation screen.
#
# --- CHECKED BEFORE "Cancel booking" (the SAFETY GATE) ---------------------------------------
#   1. the signed-in account is NATIONAL_ID (the Nafath screen AND the profile's own field);
#   2. the Active list actually holds a card at the top to cancel.
#
# --- NEVER ---------------------------------------------------------------------------------
# No reservation, no payment, no payment method, no contract signature, no OTP, no CSAT Submit
# (the NPS survey is answered with rating 5 only by the shared subflows/dismiss-nps.yaml, per the
# 28/09/2026 policy). "Other reason" is never selected (it requires free text). On the success
# screen "Reserve unit" is NEVER tapped; "View booking" is the way out, and nothing relaunches. No overlay
# helper runs between the "Cancel booking" tap and the product's confirmation, so a real product
# error in that window is never cleared away: the flow fails on it, with the error in the shot.
#
# The cancellation screens and texts are the ones proven by subflows/ensure-no-active-booking.yaml
# (09/09/2026) and by this flow (13/09/2026, run cancel3-152245: unit 01-01-0504-999-205).
appId: fi.iwa.sakani
name: PROBE - cancellation reason selection capture (NO Confirm cancellation)
tags:
  - happy-path
env:
  # Same self-referencing form as full-journey.yaml: a literal here silently BEATS `-e` on
  # Maestro 2.9.0. Default 1000011487 (standardised 14/09/2026); an empty or malformed value still
  # stops at the fail-fast guard below, before the app is launched.
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1000011487" : String(NATIONAL_ID)}'
---
# ==========================================================================================
# 0. FAIL FAST - NATIONAL_ID, before the app is launched
# ==========================================================================================
- evalScript: ${console.log('CANCEL BOOKING TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- evalScript: ${output.targetNationalId = String(NATIONAL_ID)}
# Dollar-free on purpose (a second "$" inside ${...} makes Maestro 2.9.0 skip the check and pass):
# exactly 10 characters, digits only, first digit 1 (National ID) or 2 (Iqama).
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}

# ==========================================================================================
# 1. LOGIN - then prove which account is signed in
# ==========================================================================================
- launchApp:
    clearState: true
- runFlow:
    file: D:/Automation/Maestro-Mobile/.maestro/subflows/login.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}

# Home -> Account, proven by "My bookings".
#
# FAST PATH FIRST (29/09/2026). The previous block ran clear-overlays plus an NPS check on every
# pass; each check for an ABSENT element costs Maestro ~7 s, so a clean Home took ~44 s (runs
# 11:58 and 15:47). Now: tap Account at once and wait for "My bookings" to paint - no absence
# checks on the way. The flag is set only if BOTH succeed; a tap that cannot land (tab covered by
# the NPS sheet) or a destination that does not appear falls through to the recovery below.
- evalScript: ${output.accountReached = false}
- runFlow:
    optional: true
    commands:
      - tapOn:
          text: 'Account\s*Tab 4 of 4'
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible: "My bookings"
          timeout: 15000
      - evalScript: ${output.accountReached = true}
# RECOVERY ONLY when the fast path did not arrive: the shared state-driven helper - on every pass
# the shared NPS handler (rating 5 -> Submit -> close the thank-you, product-error guard kept),
# then the same Account tap, bounded at 6 passes, arrival asserted on "My bookings".
- runFlow:
    when:
      true: ${output.accountReached !== true}
    commands:
      - evalScript: "${console.log('LEAVE HOME (after login) - Account fast path did not reach My bookings; shared recovery')}"
      - runFlow:
          file: D:/Automation/Maestro-Mobile/.maestro/subflows/tap-until-destination.yaml
          env:
            TARGET: 'Account\s*Tab 4 of 4'
            DESTINATION: "My bookings"
- evalScript: "${console.log('LEAVE HOME (after login) - My bookings reached, fast path=' + output.accountReached)}"
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 60000

# WHO IS SIGNED IN - from the profile's own "National ID" field (records output.profileNationalId
# only after it matched). All three records must agree; a mismatch fails the run right here.
- runFlow:
    file: D:/Automation/Maestro-Mobile/.maestro/subflows/verify-signed-in-account.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}
- assertTrue: ${output.loginNationalId === output.targetNationalId && output.targetNationalId === String(NATIONAL_ID) && output.profileNationalId === output.targetNationalId}
- evalScript: ${output.identityOk = output.loginNationalId === String(NATIONAL_ID) && output.profileNationalId === String(NATIONAL_ID)}

# ==========================================================================================
# 2. NAVIGATION - Account -> My bookings -> Active
# ==========================================================================================
- runFlow:
    file: D:/Automation/Maestro-Mobile/.maestro/subflows/clear-overlays.yaml
    env:
      ANCHOR: "My bookings"
- tapOn: "My bookings"
- extendedWaitUntil:
    visible: "My Bookings"
    timeout: 45000
- assertVisible: 'Active\s*Tab 2 of 4'
- assertVisible: 'Cancelled\s*Tab 4 of 4'
- tapOn: 'Active\s*Tab 2 of 4'
# The tabs paint before the list arrives: wait for a card OR the empty state, never a bare screen.
- extendedWaitUntil:
    visible: "(?s).*(\nActive\n.*Unit code|don.t have any active booking).*"
    timeout: 60000
- takeScreenshot: cancel-00-active-tab-before

# ==========================================================================================
# 3. THE FIRST CARD AT THE TOP - is there one at all?
# ==========================================================================================
- evalScript: ${output.unitCode = ""}
- evalScript: ${output.hasActiveBooking = false}
- runFlow:
    when:
      visible:
        text: "(?s).*\nActive\n.*\nUnit code\n.*"
        index: 0
    commands:
      - evalScript: ${output.hasActiveBooking = true}
      # RECORD ONLY - the unit code of that first card, used at the end to prove this booking is
      # the one that was cancelled. It plays no part in choosing it.
      - copyTextFrom:
          text: "(?s).*\nActive\n.*\nUnit code\n.*"
          index: 0
      - evalScript: '${output.unitCode = (String(maestro.copiedText).match(/Unit code\s*([0-9]{2}(-[0-9]+)+)/) || ["", ""])[1]}'
      # RECORD ONLY - a paid booking's card reads "Active\nPaid" (full-journey-with-fee); the
      # zero-fee card observed 29/09/2026 has no "Paid" line. Decides which confirmation is required.
      - evalScript: '${output.firstCardPaid = String(maestro.copiedText).indexOf("\nActive\nPaid\n") >= 0}'
      - evalScript: "${console.log('CANCEL BOOKING - first Active card at the top; its unit code is recorded as [' + output.unitCode + ']')}"

- evalScript: ${output.cancelAllowed = output.identityOk === true && output.hasActiveBooking === true}
- evalScript: "${console.log('CANCEL BOOKING DECISION - account=' + output.identityOk + ' | a first Active card is present=' + output.hasActiveBooking + ' | cancelAllowed=' + output.cancelAllowed)}"
- runFlow:
    when:
      true: ${output.hasActiveBooking !== true}
    commands:
      - evalScript: "${console.log('No active bookings available for cancellation.')}"
      - takeScreenshot: cancel-STOP-no-active-booking

# Nothing below this line runs unless the account is proven and a first card exists: the run
# stops HERE (a failed assertion, deliberately not a pass), with nothing tapped.
- assertTrue: ${output.cancelAllowed === true}

# ==========================================================================================
# 4. OPEN THE FIRST CARD - by position, with no fallback
# ==========================================================================================
# index 0 is the top card. If it cannot be opened, the steps below FAIL - the second booking is
# never tried.
- tapOn:
    text: "(?s).*\nActive\n.*\nUnit code\n.*"
    index: 0
- extendedWaitUntil:
    visible: "Booking Details"
    timeout: 45000
- takeScreenshot: cancel-01-booking-opened

# ==========================================================================================
# 5. CANCEL - through the product's own screens
# ==========================================================================================
# The 20/09 log accepted a CLIPPED 996x64 CTA as 100% visible, with zero scrolls.
# The progress card then loaded and pushed the button out of view. Wait for its
# content before scrolling. Full CTA geometry is pinned to this 1080x2400 device.
- extendedWaitUntil:
    visible: "Complete your booking"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
# Finger moves UP inside the scroll view to travel DOWN through Booking Details.
# Full height + Documents above + Android navigation bar below reject clipped nodes.
- repeat:
    times: 8
    while:
      notVisible:
        text: "^Cancel booking$"
        enabled: true
        width: 996
        height: 126
        tolerance: 4
        below:
          text: "Documents"
        above:
          id: "android:id/navigationBarBackground"
    commands:
      - swipe:
          start: "50%,85%"
          end: "50%,35%"
          duration: 600
      - waitForAnimationToEnd:
          timeout: 3000
# Re-check after the last swipe too. Stop without tapping if the full CTA is absent.
- assertVisible:
    text: "^Cancel booking$"
    enabled: true
    width: 996
    height: 126
    tolerance: 4
    below:
      text: "Documents"
    above:
      id: "android:id/navigationBarBackground"
- takeScreenshot: cancel-02-before-cancel
- evalScript: "${console.log('CANCEL BOOKING - cancelling the first Active booking, unit [' + output.unitCode + ']')}"
# Resolve the same reachable selector at tap time. Dialog appearance is the proof.
- tapOn:
    text: "^Cancel booking$"
    enabled: true
    width: 996
    height: 126
    tolerance: 4
    below:
      text: "Documents"
    above:
      id: "android:id/navigationBarBackground"
    # No Maestro-level re-tap: a dialog that paints late could take the second tap on its
    # "Yes, cancel my booking". Re-taps happen only in the destination loop below.
    retryTapIfNoChange: false

# DESTINATION PROOF (29/09/2026). The tap lands on ONE of two observed screens:
#   paid booking     -> first confirmation "...booking fee is not refunded... are you sure you
#                       want to cancel..." (runs of 13/09/2026, booking fee 8,855)
#   zero-fee booking -> straight to "Reason for cancelling", no dialog (run 2026-09-29_113933,
#                       unit 01-01-0504-999-182: ONE tap, then the reason screen)
# Bounded: each pass waits for either screen, and only while neither is up handles NPS and
# re-taps the same fully reachable CTA. "Tap COMPLETED" is never the proof.
- repeat:
    times: 3
    while:
      notVisible: "(?s)(.*booking fee is not refunded.*are you sure you want to cancel.*|Reason for cancelling)"
    commands:
      - extendedWaitUntil:
          visible: "(?s)(.*booking fee is not refunded.*are you sure you want to cancel.*|Reason for cancelling)"
          timeout: 10000
          optional: true
      - runFlow:
          when:
            notVisible: "(?s)(.*booking fee is not refunded.*are you sure you want to cancel.*|Reason for cancelling)"
          commands:
            - evalScript: "${console.log('CANCEL BOOKING - Cancel booking did not reach a cancellation screen yet; bounded re-tap')}"
            - takeScreenshot: cancel-02b-tap-did-not-transition
            - runFlow:
                file: D:/Automation/Maestro-Mobile/.maestro/subflows/dismiss-nps.yaml
            - runFlow:
                when:
                  visible:
                    text: "^Cancel booking$"
                    enabled: true
                    width: 996
                    height: 126
                    tolerance: 4
                    below:
                      text: "Documents"
                    above:
                      id: "android:id/navigationBarBackground"
                commands:
                  - tapOn:
                      text: "^Cancel booking$"
                      enabled: true
                      width: 996
                      height: 126
                      tolerance: 4
                      below:
                        text: "Documents"
                      above:
                        id: "android:id/navigationBarBackground"
                      retryTapIfNoChange: false
- assertVisible:
    text: "(?s)(.*booking fee is not refunded.*are you sure you want to cancel.*|Reason for cancelling)"
    label: "CANCEL - Cancel booking reached neither the first confirmation nor the reason screen"

# First confirmation, when shown - asserted on its own wording and BOTH actions. "No, return
# project" is the safe branch and is only asserted, never tapped.
- evalScript: ${output.cancelDialogSeen = false}
- runFlow:
    when:
      visible: "(?s).*booking fee is not refunded.*are you sure you want to cancel.*"
    commands:
      - evalScript: ${output.cancelDialogSeen = true}
      - assertVisible: "No, return project"
      - assertVisible: "Yes, cancel my booking"
      - takeScreenshot: cancel-03-first-confirmation
      - tapOn: "Yes, cancel my booking"
- evalScript: "${console.log('CANCEL BOOKING - first card paid=' + output.firstCardPaid + ' | first confirmation shown=' + output.cancelDialogSeen)}"
# A paid booking MUST be warned that its fee is not refunded; skipping that is not accepted.
- assertTrue:
    condition: ${output.firstCardPaid !== true || output.cancelDialogSeen === true}
    label: "CANCEL - paid booking went to the reason screen without the fee-not-refunded confirmation"

# Reason. "Unit area" is selected: it needs no free text, unlike "Other reason", which is never
# selected. The eight listed on this build are Project location, Project unit design, Unit price,
# Unit area, Relocation, Reject by bank, Unsigned contract, Other reason. Should "Unit area" ever
# be missing, "Relocation" - also text-free - is used; with neither, the assertion below stops the
# run with the booking still intact.
- extendedWaitUntil:
    visible: "Reason for cancelling"
    timeout: 45000
- assertVisible: "Please let us know the reason for cancelling your booking"
- takeScreenshot: cancel-04-reason-screen
# ===== PROBE ONLY - never taps Confirm cancellation =====
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot:
    path: crop-unit-area-before
    cropOn:
      text: "Unit area"
- takeScreenshot:
    path: crop-confirm-cancellation-before
    cropOn:
      text: "Confirm cancellation"
- takeScreenshot: full-before
- runFlow:
    optional: true
    commands:
      - assertVisible: "DUMP-before"
- tapOn: "Unit area"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot:
    path: crop-unit-area-after
    cropOn:
      text: "Unit area"
- takeScreenshot:
    path: crop-confirm-cancellation-after
    cropOn:
      text: "Confirm cancellation"
- takeScreenshot: full-after
- runFlow:
    optional: true
    commands:
      - assertVisible: "DUMP-after"
- assertVisible: "PROBE-END-MARKER-NOT-PRESENT"
