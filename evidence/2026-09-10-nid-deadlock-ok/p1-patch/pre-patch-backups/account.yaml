# Account & Profile regression — PRF-001, PRF-007, PRF-009, ACC-004, ACC-007.
#
# Per the automation triage in exploration-report.md these five absorb:
#   PRF-001 <- PRF-002 (contact details), PRF-003 (housing details), ACC-013 (profile opens)
#   PRF-009 <- PRF-010 (discard restores original), PRF-011 (guard Cancel returns to form)
#   ACC-004 <- ACC-003 (status surfaced on Account), ACC-005 (remediation options offered)
#   ACC-007 <- ACC-008 (actions generate notifications)
#
# Everything here is read-only except PRF-007/PRF-009, which are validation cases and so must
# dirty the edit form by definition. That edit is never saved: "Save" is never tapped, the
# guard dialog is used to discard, and the flow asserts the original email is back on screen
# before it moves on. No booking, payment, contract or eligibility state is touched -
# "Recheck eligibility" and "Appeal request" are asserted as present and deliberately NOT
# tapped, since either would mutate the account.
#
# The flow authenticates itself rather than assuming a session, so it is repeatable from any
# starting state. That login mirrors login.yaml's proven happy-path selectors without
# modifying it; the AUTH-002 validation cases and the AUTH-009 restart check remain owned by
# login.yaml and are not duplicated here.
appId: fi.iwa.sakani
name: PRF-001 profile details, PRF-007 invalid email, PRF-009 unsaved-changes guard, ACC-004 eligibility reason, ACC-007 notifications
---
- launchApp:
    clearState: true

# A cleared launch replays first-run onboarding, and the staging dashboard can raise an error
# dialog, the compare coach mark or the satisfaction survey. A cold start after a state wipe
# can take well over a minute to paint its first frame, so poll until the guest header has
# actually surfaced rather than spending a fixed budget that may expire against a blank
# screen. The loop exits as soon as the header appears.
- waitForAnimationToEnd:
    timeout: 20000
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            visible: "Skip"
          commands:
            - tapOn: "Skip"
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            visible: "Ok"
          commands:
            - tapOn: "Ok"
      - runFlow:
          when:
            visible: "Marketplace Day"
          commands:
            - back
      - runFlow:
          when:
            visible: "Start comparing properties"
          commands:
            - back
      - runFlow:
          when:
            notVisible: "(?s).*Login / Sign up.*"
          commands:
            - waitForAnimationToEnd:
                timeout: 5000

# --- Authenticate.
- extendedWaitUntil:
    visible: "(?s).*Login / Sign up.*"
    timeout: 30000
- tapOn: "(?s).*Login / Sign up.*"

- extendedWaitUntil:
    visible: "Continue with N[ae]fath"
    timeout: 30000
- tapOn: "Enter your ID, phone number,? or email"
- inputText: "1000011485"
- tapOn: "Continue"

- extendedWaitUntil:
    visible: "Login with nafath"
    timeout: 30000
- tapOn: "Confirm"
- extendedWaitUntil:
    notVisible: "Login with nafath"
    timeout: 60000

# The "Sakani Loyalty / Weekly Offer" (renamed "Sakani sharrai / weekly deal" on PRE-4.7.6-1283) sheet lands non-deterministically after authentication
# and removes "Maybe Later" from the hierarchy while it is up, so poll and clear it before
# waiting on the biometrics prompt.
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible: "Go to the weekly (offer|deal)"
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 3000
      - runFlow:
          when:
            notVisible: "Maybe Later"
          commands:
            - waitForAnimationToEnd:
                timeout: 5000
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: "Go to the weekly (offer|deal)"
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 3000
      - runFlow:
          when:
            visible: "Maybe Later"
          commands:
            - tapOn: "Maybe Later"
            - waitForAnimationToEnd:
                timeout: 3000

# Home's tab bar renders well before its content does, so wait on the tab rather than on any
# Home content, then move to Account.
- extendedWaitUntil:
    visible: 'Home\s*Tab 1 of 4'
    timeout: 60000
- tapOn: 'Account\s*Tab 4 of 4'

# Account reached and genuinely authenticated - "My bookings" exists only for a signed-in
# user, and "Log in" only for a guest.
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 60000
- assertNotVisible: "Log in"

# --- ACC-003 (merged into ACC-004): the eligibility status is surfaced on Account itself,
# before the user has to open anything. Label and value are one two-line node.
- assertVisible: 'Eligibility checker status\s*Not Eligible'

# --- PRF-001: the profile shows the account's personal, contact and housing details.
# Absorbs ACC-013 (the Profile screen opens from Account).
- tapOn: "Profile details"
- extendedWaitUntil:
    # Build PRE-4.7.6-1283 renders this section header as "Personal Details" (plural)
    # where earlier builds used the singular. Maestro selectors are FULL-match regexes,
    # so the singular no longer matches at all. Both are accepted; PRF-001's intent -
    # the profile shows the personal-details section - is unchanged.
    visible: "Personal Detail(s)?"
    timeout: 30000
- assertVisible: "Profile"

# Field labels, plus the one value worth pinning: the National ID must be the account that
# just logged in. That ties the profile to the session rather than merely checking that some
# text rendered. Name, date of birth and marital status are account test data, so only their
# labels are asserted.
- assertVisible: "National ID"
- assertVisible: "1000011485"
- assertVisible: "Name"
- assertVisible: "Date of Birth"
# Build PRE-4.7.6-1283 labels this field "Gender" (with a trailing space in the
# accessibility text) where earlier builds used "Sex". Both are matched, and the
# trailing space is absorbed - Maestro selectors are FULL-match regexes, so a bare
# "Gender" would not match the rendered "Gender ". PRF-001's intent is unchanged:
# the profile still has to expose the field.
- assertVisible: '(Sex|Gender)\s*'
- assertVisible: "Status"

# PRF-002 (merged): contact details. The email value is asserted because PRF-010 below needs
# it as the "original" to compare against after discarding; the phone number is a mutable
# account attribute, so only its label is asserted.
- assertVisible: "Contact Details"
- assertVisible: "Phone Number"
- assertVisible: "Email"
- assertVisible: "1000011483@test-sakani.housingapps.sa"

# PRF-003 (merged): housing details sit below the fold, so they are scrolled to rather than
# assumed on screen. Region and city are asserted by label only - they are account data.
- scrollUntilVisible:
    element:
      text: "Current Region"
    direction: DOWN
    timeout: 30000
- assertVisible: "Housing Details"
- assertVisible: "Current Housing Type"
- assertVisible: "Current City"
# --- end PRF-001

# --- PRF-007: a malformed email is rejected inline.
- tapOn: "Edit"
- extendedWaitUntil:
    visible: "Save"
    timeout: 30000

# The edit form marks required fields with an asterisk, so the label is "Email *". The
# asterisk is escaped because Maestro selectors are regular expressions.
- assertVisible: 'Email \*'

# The email field itself carries no accessibilityText, hintText or resource-id - it is an
# EditText holding only the current value - so it is targeted by position relative to its
# label, which is static. No coordinate tap is needed.
#
# The malformed value is produced by typing INTO the existing address rather than by clearing
# it first. That is deliberate: `eraseText` only deletes backwards from the caret, and tapping
# the field puts the caret wherever the tap landed, so a clear-then-retype leaves an
# unpredictable tail (observed: "apps.sa" surviving an 80-character erase). Inserting at the
# caret is fully deterministic - same original address and same tap position every run - and
# yields "1000011483@test-sakani.@@badhousingapps.sa", which is malformed by the double "@"
# exactly as this case's test data intends.
- tapOn:
    below:
      text: 'Email \*'
- inputText: "@@bad"

# PRF-007 expected result: inline rejection.
# Build PRE-4.7.6-1283 words this inline error "Invalid email address" where earlier
# builds said "Email is invalid". Both are matched. PRF-007 is unchanged and still
# proves the real thing: the malformed address is entered and the app rejects it inline.
- extendedWaitUntil:
    visible: "(Email is invalid|Invalid email address)"
    timeout: 20000
# --- end PRF-007

# --- PRF-009: leaving a dirty form warns before discarding.
# "Save" is never tapped anywhere in this flow - the edit exists only to raise this guard.
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "You have unsaved changes"
    timeout: 20000
- assertVisible: "Are you sure you want to cancel?"
- assertVisible: "Yes I am sure"

# PRF-011 (merged): the guard's own "Cancel" returns to the form with the edit still there.
# While the dialog is up the form header's "Cancel" leaves the hierarchy, so this selector is
# unambiguous - it can only resolve to the dialog button.
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "You have unsaved changes"
    timeout: 20000
- assertVisible: "Save"
- assertVisible: 'Email \*'
- assertVisible: "(Email is invalid|Invalid email address)"

# Re-raise the guard so the discard acts on a freshly raised dialog.
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "You have unsaved changes"
    timeout: 20000

# PRF-010 (merged): discarding restores the original value. This is also what guarantees the
# flow leaves no temporary input behind - the assertion below is the proof that the account's
# real email is back, unmodified.
- tapOn: "Yes I am sure"
- extendedWaitUntil:
    visible: "1000011483@test-sakani.housingapps.sa"
    timeout: 30000
- assertVisible: "Personal Detail(s)?"
- assertNotVisible: "(Email is invalid|Invalid email address)"
- assertNotVisible: "Save"
# --- end PRF-009

# --- ACC-004: the eligibility screen explains the decision rather than just stating it.
- back
- extendedWaitUntil:
    visible: "Profile details"
    timeout: 30000
- tapOn: 'Eligibility checker status\s*Not Eligible'

- extendedWaitUntil:
    visible: "Reasons for ineligibility"
    timeout: 30000
- assertVisible: "Eligibility"

# The decision itself. The apostrophe rendered here is a typographic right single quote, not
# an ASCII one, so it is matched with "." rather than risking an encoding mismatch.
- assertVisible: "You.re not eligible for Housing Support"

# The audit trail: the screen states when the check was run. The date itself moves, so only
# the label is asserted.
- assertVisible: "Checked on"
- assertVisible: "Status"

# ACC-005 (merged): remediation is offered rather than leaving the user at a dead end. These
# are asserted as present and NEVER tapped - "Recheck eligibility" would re-run the
# assessment and "Appeal request" would lodge an appeal, both of which mutate the account.
- assertVisible: "Other options"
- assertVisible: "(?s).*Recheck eligibility.*"
- assertVisible: "(?s).*Appeal request.*"
- assertVisible: "(?s).*Browse marketplace.*"
- assertVisible: "Go to Ejar"
# --- end ACC-004

# --- ACC-007: the Notifications Center lists notifications with timestamps.
- back
- extendedWaitUntil:
    visible: "Profile details"
    timeout: 30000
- tapOn: "Notifications"

- extendedWaitUntil:
    visible: "Notifications Center"
    timeout: 30000

# Each notification is one node combining title, timestamp and body. The number of
# notifications and their subjects are account data, so the assertion is that at least one
# card carries a timestamp - in any of the forms this screen uses (clock time for today, a
# weekday name for the last week).
- assertVisible: '(?s).*(\d{1,2}:\d{2}\s*(AM|PM)|Today|Yesterday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday).*'

# ACC-008 (merged): actions taken on this account generated notifications. These two are the
# outcomes of the booking lifecycle already exercised by booking.yaml, and nothing in this
# flow changes booking state, so they are stable to assert.
- assertVisible: "(?s).*Sign sales contract.*"
- assertVisible: "(?s).*Congrats!.*successfully booked.*"
# --- end ACC-007
