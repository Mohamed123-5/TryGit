# Account & Profile regression — PRF-001, PRF-007, PRF-009, ACC-004, ACC-007.
#
# Per the automation triage in exploration-report.md these five absorb:
#   PRF-001 <- PRF-002 (contact details), PRF-003 (housing details), ACC-013 (profile opens)
#   PRF-009 <- PRF-010 (discard restores original), PRF-011 (guard Cancel returns to form)
#   ACC-004 <- ACC-003 (status surfaced on Account), ACC-005 (remediation options offered)
#   ACC-007 <- ACC-008 (actions generate notifications)
#
# Everything here is read-only except PRF-007/PRF-009, which are validation cases and so must
# dirty the edit form by definition. That edit is never saved: "Save" is never tapped, the
# guard dialog is used to discard, and the flow asserts the original email is back on screen
# before it moves on. No booking, payment, contract or eligibility state is touched -
# "Recheck eligibility" and "Appeal request" are asserted as present and deliberately NOT
# tapped, since either would mutate the account.
#
# The flow authenticates itself rather than assuming a session, so it is repeatable from any
# starting state. That login mirrors login.yaml's proven happy-path selectors without
# modifying it; the AUTH-002 validation cases and the AUTH-009 restart check remain owned by
# login.yaml and are not duplicated here.
appId: fi.iwa.sakani
name: PREFIX account - own steps up to the Nafath ID check, never confirms
env:
  # The account this flow signs in as - defined once, here. Default (no override): 1000011485.
  #   maestro test -e NATIONAL_ID=<10-digit National ID / Iqama> .maestro/account.yaml
  # A self-referencing default, NOT a literal: on Maestro 2.9.0 a literal here silently beats
  # `-e NATIONAL_ID=...`. Single-quoted because the expression contains ": ".
  #
  # ACCOUNT DATA: the cases below also assert this account's own data - the email
  # 1000011483@test-sakani.housingapps.sa, a "Not Eligible" status with its reasons screen, and
  # booking-lifecycle notifications. An override must point at an account holding the same data,
  # or those assertions fail loudly; they are deliberately not re-pointed at whoever logged in.
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1000011485" : String(NATIONAL_ID)}'
---
# Fail fast, before the app is touched, on an empty or malformed override. Dollar-free on
# purpose: a "$" inside ${...} makes Maestro 2.9.0 skip evaluation and pass the assert.
- evalScript: ${console.log('ACCOUNT.YAML TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}
- launchApp:
    clearState: true

# A cleared launch replays first-run onboarding, and the staging dashboard can raise an error
# dialog, the compare coach mark or the satisfaction survey. A cold start after a state wipe
# can take well over a minute to paint its first frame, so poll until the guest header has
# actually surfaced rather than spending a fixed budget that may expire against a blank
# screen. The loop exits as soon as the header appears.
- waitForAnimationToEnd:
    timeout: 20000
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            visible: "Skip"
          commands:
            - tapOn: "Skip"
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            visible: "Ok"
          commands:
            - tapOn: "Ok"
      - runFlow:
          when:
            visible: "Marketplace Day"
          commands:
            - back
      - runFlow:
          when:
            visible: "Start comparing properties"
          commands:
            - back
      - runFlow:
          when:
            notVisible: "(?s).*Login / Sign up.*"
          commands:
            - waitForAnimationToEnd:
                timeout: 5000

# --- Authenticate.
- extendedWaitUntil:
    visible: "(?s).*Login / Sign up.*"
    timeout: 30000
- tapOn: "(?s).*Login / Sign up.*"

- extendedWaitUntil:
    visible: "Continue with N[ae]fath"
    timeout: 30000
- tapOn: "Enter your ID, phone number,? or email"
- inputText: ${NATIONAL_ID}
- tapOn: "Continue"

- extendedWaitUntil:
    visible: "Login with nafath"
    timeout: 30000
# The Nafath screen must carry EXACTLY the requested ID before the session is created - the last
# point at which a wrong account can be stopped before it is authenticated.
- assertVisible: ${NATIONAL_ID}

- takeScreenshot: prefix-account-nafath
