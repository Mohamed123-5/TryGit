# OUT-002 — Logging out clears the session.
#
# Scope: OUT-002 only. Per the automation triage in exploration-report.md this case
# absorbs OUT-001 (logout asks for confirmation), OUT-003 (guest menu is reduced) and
# ACC-021, so all three are asserted here.
#
# The flow authenticates itself rather than relying on a pre-existing session: it logs
# out, so a second run would otherwise start as a guest and fail. That login reuses
# login.yaml's proven happy-path selectors without modifying it - the AUTH-002 validation
# cases and the AUTH-009 restart check remain owned by login.yaml and are not duplicated.
#
# Security-relevant: an incomplete logout that leaves a stored token behind would be a
# serious defect, so the final section relaunches the app and re-checks the guest state
# rather than trusting the screen that was on top immediately after logging out.
appId: fi.iwa.sakani
name: PREFIX logout - own steps up to the Nafath ID check, never confirms
env:
  # The account this flow signs in as and then logs out - defined once, here. Default (no
  # override): 1000011485.
  #   maestro test -e NATIONAL_ID=<10-digit National ID / Iqama> .maestro/logout.yaml
  # A self-referencing default, NOT a literal: on Maestro 2.9.0 a literal here silently beats
  # `-e NATIONAL_ID=...`. Single-quoted because the expression contains ": ".
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1000011485" : String(NATIONAL_ID)}'
---
# Fail fast, before the app is touched, on an empty or malformed override. Dollar-free on
# purpose: a "$" inside ${...} makes Maestro 2.9.0 skip evaluation and pass the assert.
- evalScript: ${console.log('LOGOUT.YAML TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}
- launchApp:
    clearState: true

# A cleared launch replays first-run onboarding, and the staging dashboard can raise an
# error dialog, the compare coach mark or the satisfaction survey.
# A cold start after a state wipe on build PRE-4.7.5-1279 can take well over a minute to
# paint its first frame. The process is alive and healthy throughout - logcat shows no
# crash, no tombstone and no ANR, the UI simply has not rendered yet - so the previous
# fixed settling budget (20s + 5x5s) could expire against a still-blank screen and fail
# on an app that was about to come up. Poll until the guest header has actually surfaced,
# clearing whichever overlay is on top. The loop exits as soon as the header appears, so
# it costs nothing on a fast start and no assertion below is relaxed.
- waitForAnimationToEnd:
    timeout: 20000
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            visible: "Skip"
          commands:
            - tapOn: "Skip"
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            visible: "Ok"
          commands:
            - tapOn: "Ok"
      - runFlow:
          when:
            visible: "Marketplace Day"
          commands:
            - back
      - runFlow:
          when:
            visible: "Start comparing properties"
          commands:
            - back
      - runFlow:
          when:
            notVisible: "(?s).*Login / Sign up.*"
          commands:
            - waitForAnimationToEnd:
                timeout: 5000

# --- Establish the authenticated session this case starts from.
- extendedWaitUntil:
    visible: "(?s).*Login / Sign up.*"
    timeout: 30000
- tapOn: "(?s).*Login / Sign up.*"

- extendedWaitUntil:
    visible: "Continue with N[ae]fath"
    timeout: 30000
- tapOn: "Enter your ID, phone number,? or email"
- inputText: ${NATIONAL_ID}
- tapOn: "Continue"

- extendedWaitUntil:
    visible: "Login with nafath"
    timeout: 30000
# The Nafath screen must carry EXACTLY the requested ID before the session is created - the last
# point at which a wrong account can be stopped before it is authenticated.
- assertVisible: ${NATIONAL_ID}

- takeScreenshot: prefix-logout-nafath
