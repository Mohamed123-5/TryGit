# Wallet, Mortgage and Preferences regression — WAL-008, MTG-009, WAL-010, PRE-002, PRE-008.
#
# Per the automation triage in exploration-report.md these absorb:
#   WAL-008 <- WAL-007 (Withdraw disabled when empty), WAL-009 (amount auto-formats)
#   PRE-002 <- PRE-003 (registered-interest tabs)
#   PRE-008 <- PRE-001 (hub lists options), PRE-006 (form step 1), PRE-007 (Next disabled on
#              empty), PRE-009 (Cancel discards), ACC-014 (Preferences opens)
#   MTG-009 <- MTG-002, MTG-003, MTG-005, MTG-006, MTG-007, MTG-008, UNIT-008, UNIT-009
#
# Everything is read-only. No withdrawal is submitted, no calculation is submitted, no
# preference is saved, and no profile, eligibility, booking, payment or contract state is
# touched. The two forms that are dirtied (Withdraw, Preference form) are both abandoned
# without saving.
#
# TWO CASES DO NOT PASS, AND ARE LEFT ASSERTING THE CORRECT BEHAVIOUR ON PURPOSE:
#
#   WAL-010 is the designated regression guard for defect D-31 - Android Back does not work
#   on the Wallet screen. It is placed LAST so every other case executes first, because
#   Maestro aborts a flow at the first failed assertion. While D-31 is open this flow exits
#   non-zero BY DESIGN, with everything above it COMPLETED. Do not "fix" it by removing the
#   assertion or by substituting the header arrow - that would delete the only guard proving
#   the defect is still there.
#
#   MTG-009's own expected result ("Calculate button enabled once all fields are set") is not
#   observable on this build: the button's accessibility node is identical whether it is
#   greyed out or active - desc="Calculate Your Mortgage", clickable="true", enabled="true",
#   bounds=[0,0][1080,2337] (the whole screen). Because the node covers the screen, no
#   selector resolves to the button either. The MTG sub-cases that ARE observable are
#   automated below; the enabled-state assertion is reported BLOCKED rather than replaced
#   with a weaker one that would pass without testing anything.
#
# The flow authenticates itself so it is repeatable from any starting state, mirroring
# login.yaml's proven happy-path selectors without modifying it.
appId: fi.iwa.sakani
name: WAL-008 over-balance withdrawal blocked, PRE-002 registered-interest empty state, PRE-008 preference-form gate, MTG validation, WAL-010 D-31 guard
env:
  # The account this flow signs in as - defined once, here. Default (no override): 1000011485.
  #   maestro test -e NATIONAL_ID=<10-digit National ID / Iqama> .maestro/wallet.yaml
  # A self-referencing default, NOT a literal: on Maestro 2.9.0 a literal here silently beats
  # `-e NATIONAL_ID=...`. Single-quoted because the expression contains ": ".
  #
  # ACCOUNT DATA: PRE-002 expects this account's registered-interest list to be EMPTY.
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1000011485" : String(NATIONAL_ID)}'
---
# Fail fast, before the app is touched, on an empty or malformed override. Dollar-free on
# purpose: a "$" inside ${...} makes Maestro 2.9.0 skip evaluation and pass the assert.
- evalScript: ${console.log('WALLET.YAML TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}
- launchApp:
    clearState: true

- waitForAnimationToEnd:
    timeout: 20000
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            visible: "Skip"
          commands:
            - tapOn: "Skip"
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            visible: "Ok"
          commands:
            - tapOn: "Ok"
      - runFlow:
          when:
            visible: "Marketplace Day"
          commands:
            - back
      - runFlow:
          when:
            visible: "Start comparing properties"
          commands:
            - back
      - runFlow:
          when:
            notVisible: "(?s).*Login / Sign up.*"
          commands:
            - waitForAnimationToEnd:
                timeout: 5000

# --- Authenticate.
- extendedWaitUntil:
    visible: "(?s).*Login / Sign up.*"
    timeout: 30000
- tapOn: "(?s).*Login / Sign up.*"
- extendedWaitUntil:
    visible: "Continue with N[ae]fath"
    timeout: 30000
- tapOn: "Enter your ID, phone number,? or email"
- inputText: ${NATIONAL_ID}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Login with nafath"
    timeout: 30000
# The Nafath screen must carry EXACTLY the requested ID before the session is created - the last
# point at which a wrong account can be stopped before it is authenticated.
- assertVisible: ${NATIONAL_ID}
- tapOn: "Confirm"
- extendedWaitUntil:
    notVisible: "Login with nafath"
    timeout: 60000

- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible: "Go to the weekly (offer|deal)"
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 3000
      - runFlow:
          when:
            notVisible: "Maybe Later"
          commands:
            - waitForAnimationToEnd:
                timeout: 5000
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: "Go to the weekly (offer|deal)"
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 3000
      - runFlow:
          when:
            visible: "Maybe Later"
          commands:
            - tapOn: "Maybe Later"
            - waitForAnimationToEnd:
                timeout: 3000

- extendedWaitUntil:
    visible: 'Home\s*Tab 1 of 4'
    timeout: 60000
- tapOn: 'Account\s*Tab 4 of 4'
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 60000
- assertNotVisible: "Log in"

# --- PRE-002: the registered-interest list shows an empty state with a route out of it.
# Absorbs PRE-001 / ACC-014 (the Preferences hub opens and lists its two options) and
# PRE-003 (the interest categories are tabbed).
- tapOn: "Preferences"
- extendedWaitUntil:
    visible: "(?s).*Registered interest.*"
    timeout: 30000
- assertVisible: "(?s).*Preference form.*"

- tapOn: "(?s).*Registered interest.*"
- extendedWaitUntil:
    visible: "Your register interest list is empty"
    timeout: 30000

# PRE-003: the four interest categories.
- assertVisible: "Mega projects"
- assertVisible: "Projects"
- assertVisible: "Brokers"
- assertVisible: "Developers"

# PRE-002: the empty state explains itself and offers a way forward rather than dead-ending.
- assertVisible: "Explore marketplace to register your interests"
- assertVisible: "Explore marketplace"
# --- end PRE-002

# Back from the interest list returns to Account, not to the Preferences hub, so the hub is
# re-entered rather than assumed.
- back
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 30000

# --- PRE-008: the preference form will not advance until the required Region is chosen.
# Absorbs PRE-006 (step 1 layout), PRE-007 (Next disabled on an empty form) and PRE-009
# (Cancel discards). Nothing is ever saved - the form is always left via Cancel.
- tapOn: "Preferences"
- extendedWaitUntil:
    visible: "(?s).*Preference form.*"
    timeout: 30000
- tapOn: "(?s).*Preference form.*"

# PRE-006: step 1 of the form, its required location fields and its two chip groups.
- extendedWaitUntil:
    visible: "Step 1 of 2"
    timeout: 30000
- assertVisible: "Region"
- assertVisible: "City"
- assertVisible: "Neighborhood"
- assertVisible: "Completion status"
- assertVisible: "Property type"

# PRE-007 and PRE-008 are behavioural checks, because the Next button cannot be asserted
# directly: it has no accessibility node of its own. The bottom bar exposes only "Cancel"
# ([42,2169][530,2295]); Next's semantics are merged into a container spanning the whole
# form ([42,321][1038,2295]), whose centre is a chip rather than the button. The tap is
# therefore placed by point, on the right half of the button row where Next is drawn, next
# to the Cancel button that IS addressable. A percentage is used so it scales across screen
# sizes; on this 1080x2400 device it resolves to (788,2232).
#
# Tapping a disabled button is safe - the assertion is precisely that nothing happens.

# PRE-007: empty form - Next must not advance.
- tapOn:
    point: "73%,93%"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: "Step 1 of 2"
- assertNotVisible: "Step 2 of 2"

# PRE-008: completion status and property type chosen, Region still empty - Next must STILL
# not advance, because Region is the required field and chips alone do not satisfy it.
# Build PRE-4.7.6-1283 labels this completion-status option "Ready Units" where earlier
# builds used "Readymade Units". Same idiom marketplace.yaml already uses, so the one
# selector works on either build. Only the label moved - the option selected is the same.
- tapOn: "Ready(made| )?Units"
- tapOn: "Villa"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "73%,93%"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: "Step 1 of 2"
- assertNotVisible: "Step 2 of 2"

# PRE-009: Cancel abandons the dirty form and returns to the hub with nothing saved.
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "(?s).*Preference form.*"
    timeout: 30000
- assertNotVisible: "Step 1 of 2"
# --- end PRE-008

- back
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 30000

# --- Mortgage Calculator: the MTG-009 cluster, limited to the sub-cases that are observable.
# Route is Services -> Professional Services -> Mortgage Calculator, the path already proven
# by home.yaml's SRV-001.
- tapOn: 'Services\s*Tab 3 of 4'
- extendedWaitUntil:
    visible: "Categories"
    timeout: 30000
- tapOn: "(?s).*Professional Services.*"
- extendedWaitUntil:
    visible: "Explore Professional Services"
    timeout: 30000
- tapOn: "(?s).*Mortgage Calculator.*"

# MTG-002: the service info sheet states the fee and the expected duration before the user
# commits to anything. The fee is one node split across lines, hence \s*.
- extendedWaitUntil:
    visible: "Calculate Your Mortgage"
    timeout: 30000
- assertVisible: 'Services Fee\s*SAR\s*0\.00'
# RE-BASELINED for PRE-4.7.6-1283. This service now advertises its duration as
# "Immediate" where the build this case was written against said "5 Mins" (captured
# live: the sheet renders Expected time followed by Immediate). It is pinned rather than
# relaxed to any-value, so the assertion keeps its original strength - MTG-002 still
# requires the duration to be DISCLOSED, and would still fail if it disappeared.
# The fee half of the case is unchanged and still passes.
- assertVisible: 'Expected time\s*Immediate'
- assertVisible: 'Service available on\s*Sakani web, mobile app'

# MTG-003: the financial information form opens with its required fields marked.
- tapOn: "Calculate Your Mortgage"
- extendedWaitUntil:
    visible: "Financial information"
    timeout: 30000
- assertVisible: 'Property Price \*'
- assertVisible: 'Monthly Income \*'
- assertVisible: 'Financing Term \*'
- assertVisible: 'Interest Rate \*'
- assertVisible: 'Down Payment Percentage \*'

# MTG-005: an income outside the stated range is flagged.
#
# The value is TYPED rather than read from the field's initial contents. That matters: this
# build opens the form with Monthly Income pre-filled "900,000,000", which is itself outside
# the field's stated 2,000-500,000 range (defect D-23, confirmed still reproducing). Asserting
# the error against that pre-filled value would pass only because of the defect, and would
# start failing the day D-23 is fixed. Typing a known out-of-range value tests the validation
# rule on its own terms and stays correct either way.
#
# The field carries no accessibilityText, hintText or resource-id, so it is targeted relative
# to its static label. It is cleared first so the typed value is not appended to the default.
- tapOn:
    below:
      text: 'Monthly Income \*'
- eraseText: 20
- inputText: "1000"
- extendedWaitUntil:
    visible: "(?s).*Must be between.*2000.*500,000.*"
    timeout: 20000

# MTG-006: a valid income clears the error.
- tapOn:
    below:
      text: 'Monthly Income \*'
- eraseText: 20
- inputText: "20000"
- extendedWaitUntil:
    notVisible: "(?s).*Must be between.*2000.*500,000.*"
    timeout: 20000

# MTG-007 / MTG-008 / MTG-009 (Calculate disabled until every required field and both radio
# questions are set, then enabled) are NOT asserted here - see the header note. The button
# reports clickable="true" enabled="true" whether it is greyed out or active, so there is
# nothing to assert against, and its node covers the whole screen so no selector reaches it.
# Nothing is submitted: the calculation is never run.
# --- end Mortgage Calculator

# Leave the calculator without saving anything and return to the Account tab.
- back
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible: 'Account\s*Tab 4 of 4'
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    visible: 'Account\s*Tab 4 of 4'
    timeout: 30000
- tapOn: 'Account\s*Tab 4 of 4'
- extendedWaitUntil:
    visible: "My bookings"
    timeout: 30000

# --- WAL-008: a withdrawal larger than the balance is rejected.
# Absorbs WAL-007 (Withdraw inert while the amount is empty) and WAL-009 (amount formatting).
# No withdrawal is ever submitted.
#
# The Account row carries the balance once it loads ("Wallet / SAR / 827,670") and is just
# "Wallet" until then, so it is matched loosely enough to hit either state.
- tapOn: "(?s).*Wallet.*"
- extendedWaitUntil:
    visible: "Available Balance"
    timeout: 30000
- assertVisible: "Reserved Balance"
- assertVisible: "Total Balance"
- assertVisible: "Transaction history"

- tapOn: "Withdraw"
- extendedWaitUntil:
    visible: "Use max balance"
    timeout: 30000

# WAL-007: with no amount entered the Withdraw button must not act. The button and the screen
# title share the label "Withdraw", so the button is addressed by position relative to the
# static "Designed to Keep You Safe" note directly above it rather than by its text, which
# would resolve to the title. Tapping is safe: the button is disabled (clickable="false") and
# the amount is empty, so no withdrawal can be initiated - and the assertion is that we are
# still on the form afterwards.
- tapOn:
    below:
      text: "Designed to Keep You Safe"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: "Use max balance"
- assertVisible: "(?s).*Wallet balance.*"

# The amount field exposes no accessibilityText, hintText or resource-id. It sits immediately
# right of the "SAR" prefix, which is the stable anchor - "Use max balance" is deliberately
# NOT used as an anchor, and never tapped, because it populates the field with the full
# balance instead of the over-balance figure this case needs.
- tapOn:
    rightOf:
      text: "SAR"
- inputText: "999999999"

# WAL-009: the amount is auto-formatted with thousands separators as it is typed.
- extendedWaitUntil:
    visible: "999,999,999"
    timeout: 20000

# WAL-008 expected result: the over-balance amount is rejected inline. Nothing is submitted.
- extendedWaitUntil:
    visible: "The amount exceeds the available balance."
    timeout: 20000
# --- end WAL-008

# Back out of the Withdraw form. Back works here - it is the Wallet screen itself that does
# not respond to it, which is what WAL-010 below exists to prove.
#
# The numeric keyboard is still up from entering the amount, and it swallows the first Back,
# so a single press leaves the form still showing. Press until the Wallet screen is actually
# back, bounded. The loop stops as soon as Wallet is reached, so it cannot run on into
# WAL-010's territory and consume the Back press that case depends on.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible: "Transaction history"
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 6000
- extendedWaitUntil:
    visible: "Transaction history"
    timeout: 30000
- assertVisible: "Available Balance"

# --- WAL-010: Android Back must exit Wallet and return to Account.
#
# THIS IS THE D-31 REGRESSION GUARD AND IT IS EXPECTED TO FAIL while the defect is open:
# Back is swallowed on the Wallet screen and only the header arrow exits. It is deliberately
# the last step in the flow so that every other case has already run and reported.
#
# Keep the assertion as written. "Fixing" it by tapping the header arrow instead would make
# the flow green while silently dropping the only coverage that proves D-31 is still there.
- back
- extendedWaitUntil:
    visible: "Profile details"
    timeout: 30000
- assertVisible: "My bookings"
- assertNotVisible: "Available Balance"
# --- end WAL-010
