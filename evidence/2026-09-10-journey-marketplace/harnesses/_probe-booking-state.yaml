appId: fi.iwa.sakani
name: PROBE - read the booking and contract state after the journey (read-only, current session)
---
# READ-ONLY. Relaunches WITHOUT clearing state (keeps the signed-in session), opens My Bookings,
# reads the Active and Ready-to-sign filters, opens the booking card and reads its steps and
# Documents. It never taps "Sign contract", "Select payment method", "Cancel booking",
# "Approve", "Reject" or any survey control other than what clear-overlays already does.
- launchApp
- runFlow:
    file: subflows/clear-overlays.yaml
    env:
      ANCHOR: 'Account\s*Tab 4 of 4'
- tapOn: 'Account\s*Tab 4 of 4'
- runFlow:
    file: subflows/clear-overlays.yaml
    env:
      ANCHOR: "My bookings"
- tapOn: "My bookings"
- extendedWaitUntil:
    visible: 'Active\s*Tab 2 of 4'
    timeout: 45000
- tapOn: 'Active\s*Tab 2 of 4'
- extendedWaitUntil:
    visible: "(?s).*(\nActive\n.*Unit code|don.t have any active booking).*"
    timeout: 60000
- takeScreenshot: state-1-active
- tapOn: "Ready to sign"
- extendedWaitUntil:
    visible: "(?s).*(\nActive\n.*Unit code|don.t have any booking).*"
    timeout: 45000
- takeScreenshot: state-2-ready-to-sign
- tapOn: "All"
- extendedWaitUntil:
    visible: "(?s).*\nActive\n.*Unit code.*"
    timeout: 45000
- tapOn: "(?s).*\nActive\n.*Unit code.*"
- extendedWaitUntil:
    visible: "Booking Details"
    timeout: 45000
- takeScreenshot: state-3-booking-top
- scrollUntilVisible:
    element:
      text: "Documents"
    direction: DOWN
    timeout: 30000
- takeScreenshot: state-4-documents
